<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#080a10;overflow:hidden;font-family:'Courier New',monospace;touch-action:none;user-select:none;-webkit-user-select:none;}

/* 품질 프리셋 선택 (타이틀 화면 전용) */
#qbar{display:flex;gap:6px;margin-top:2px;}
.qbtn{padding:7px 13px;background:transparent;border:1px solid rgba(255,102,34,.4);
      color:rgba(255,140,70,.7);font-family:'Courier New',monospace;font-size:10px;
      letter-spacing:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}

<script>
// 전역 에러 핸들러 — CDN 모듈 내부 예외도 최대한 상세히 콘솔에 노출
window.addEventListener('error', function(e){
  console.error('[GAME ERROR]', e.message, 'at', e.filename+':'+e.lineno+':'+e.colno, e.error);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('[GAME PROMISE ERROR]', e.reason);
});

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

// ── CONSTANTS ──
const CELL=2.0,WALL_H=2.6,MW=25,MH=25;
const PLAYER_R=0.32,PLAYER_SPD=4.5,TURN_SPD=2.6,ACCEL=16,FRIC=11;
const MON_COUNT=lv=>Math.min(lv,3);
const MON_BASE_SPD=2.2,MON_SPD_INC=0.12;
const MON_SIGHT_R=8,MON_HEAR_R=4,MON_KILL_R=0.7;
// 발각 직후의 돌진 — 이 세 값이 "달려든다"는 체감을 좌우한다. 난이도에 직결되므로
// 사용자가 직접 플레이하며 조정할 값이다. 임의로 올리지 말 것.
const CHARGE_TIME=1.5,CHARGE_BOOST=1.35;
const SNARL_MIN=1.1,SNARL_VAR=0.9;   // 추격 중 으르렁 간격(초)

// ── QUALITY PRESETS ──
// 설계 원칙
//  1) 광원 개수 / 텍스처 해상도 / 재질 타입 / antialias 는 "부팅 시점 상수"로 취급한다.
//     antialias는 WebGL 컨텍스트 생성 파라미터라 런타임 변경이 불가능하고, 나머지도 전면
//     재생성이 필요하다. 따라서 프리셋 변경은 localStorage 저장 후 reload로만 적용한다.
//  2) 런타임에 움직이는 축은 renderScale 하나뿐. 해상도만 건드리므로 셰이더 재컴파일이 없다.
//     (적응형 자동 조절이 광원을 만지면 hitching이 발생한다 — 절대 금지)
//  3) 게임 밸런스 값(fog 밀도, 몬스터 시야·청각·속도)은 프리셋에 넣지 않는다.
//     품질 설정으로 난이도가 달라지면 안 된다.
//
// 총 광원 수 = ambient 1 + 횃불 N + 몬스터 눈 M + 출구 1
//   LOW 5 / MEDIUM 6 / HIGH 9 / ULTRA 11
// ambient / torchRange / torchPower는 광원 "개수"를 늘리지 않고 밝기를 보정하는 축이다.
// AmbientLight는 픽셀당 광원 순회에 들어가지 않고, PointLight의 distance·intensity는
// 순회 횟수를 바꾸지 않으므로 셋 다 사실상 공짜다. 광원이 적은 프리셋일수록 이 값을 올려
// 횃불 사이 구간이 캄캄해지는 것을 막는다.
const QUALITY_PRESETS={
  LOW:   {label:'LOW',  prCap:1.0,scale:0.6,torchLights:2,monLights:1,texSize:128,aniso:1,aa:false,matType:'phong',   torchInterval:0.20,mmInterval:8,panning:'equalpower',targetFps:30,ambient:3.6,torchRange:8.5,torchPower:1.10},
  MEDIUM:{label:'MED',  prCap:1.5,scale:0.8,torchLights:3,monLights:1,texSize:256,aniso:1,aa:false,matType:'phong',   torchInterval:0.15,mmInterval:6,panning:'HRTF',      targetFps:55,ambient:3.4,torchRange:7.8, torchPower:1.05},
  HIGH:  {label:'HIGH', prCap:2.0,scale:1.0,torchLights:4,monLights:3,texSize:256,aniso:4,aa:true, matType:'standard',torchInterval:0.12,mmInterval:4,panning:'HRTF',      targetFps:55,ambient:3.2,torchRange:7.0, torchPower:1.00},
  ULTRA: {label:'ULTRA',prCap:3.0,scale:1.0,torchLights:6,monLights:3,texSize:512,aniso:0,aa:true, matType:'standard',torchInterval:0.10,mmInterval:4,panning:'HRTF',      targetFps:60,ambient:3.2,torchRange:7.0, torchPower:1.00},
};
const QKEY='de_quality';
const isMobile=/iPhone|iPad|Android/i.test(navigator.userAgent);

// iOS Safari는 deviceMemory를 노출하지 않고 hardwareConcurrency도 대부분 4로 보고한다.
// 따라서 모바일에서 `cores<=4`를 LOW 조건으로 쓰면 최신 아이폰까지 전부 LOW로 떨어진다.
// 모바일은 확실히 낮은 신호(코어 2개 이하 또는 메모리 2GB 이하)일 때만 LOW로 보낸다.
function detectQuality(){
  const cores=navigator.hardwareConcurrency||4;
  const mem=navigator.deviceMemory;                    // 미지원이면 undefined
  if(isMobile) return (cores<=2||mem<=2)?'LOW':'MEDIUM';
  return (cores<=4||(mem!==undefined&&mem<=4))?'MEDIUM':'HIGH';
}
function loadQualityName(){
  let n=null;
  try{n=localStorage.getItem(QKEY);}catch(_){}
  return QUALITY_PRESETS[n]?n:detectQuality();
}
const QNAME=loadQualityName();
const Q=QUALITY_PRESETS[QNAME];
let renderScale=Q.scale;   // 적응형이 조절하는 유일한 런타임 값

// ── MAZE GENERATOR (loop maze) ──
function generateMaze(W,H){
  const g=Array.from({length:H},()=>new Array(W).fill(0));
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
  function carve(x,y){
    g[y][x]=1;
    for(const[dx,dy]of sh([[0,-2],[0,2],[-2,0],[2,0]])){
      const nx=x+dx,ny=y+dy;
      if(ny>=0&&ny<H&&nx>=0&&nx<W&&g[ny][nx]===0){g[y+dy/2][x+dx/2]=1;carve(nx,ny);}
    }
  }
  carve(1,1); g[H-2][W-2]=1;
  // Add loops: remove 18% of interior walls that border 2+ paths
  const walls=[];
  for(let r=1;r<H-1;r++)for(let c=1;c<W-1;c++)if(g[r][c]===0)walls.push([c,r]);
  sh(walls);
  const rem=Math.floor(walls.length*0.18);
  for(let i=0;i<rem;i++){
    const[c,r]=walls[i];
    const n=[[0,-1],[0,1],[-1,0],[1,0]].filter(([dc,dr])=>g[r+dr]&&g[r+dr][c+dc]===1).length;
    if(n>=2)g[r][c]=1;
  }
  return g;
}

// ── THREE SETUP ──
const cv=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:Q.aa});
// setPixelRatio는 내부에서 setSize(w,h,false)를 호출하므로 별도 리사이즈가 필요 없다.
function applyRenderScale(){
  renderer.setPixelRatio(Math.min(devicePixelRatio,Q.prCap)*renderScale);
}
applyRenderScale();
renderer.setSize(innerWidth,innerHeight);
const MAX_ANISO=renderer.capabilities.getMaxAnisotropy();
renderer.shadowMap.enabled=false;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080a10);
scene.fog=new THREE.FogExp2(0x080a10,0.058);
const camera=new THREE.PerspectiveCamera(80,innerWidth/innerHeight,0.05,60);
scene.add(camera);
// AmbientLight는 픽셀당 광원 순회 비용이 없다 — 광원이 적은 프리셋의 암부를 메우는 데 쓴다
scene.add(new THREE.AmbientLight(0x1a1e2a,Q.ambient));

// ── DUNGEON TEXTURES ──
// 모든 좌표·크기·반복 횟수는 256px 기준으로 작성한 뒤 s=size/256 을 곱한다.
// 그냥 캔버스 크기만 바꾸면 128에서는 벽돌이 2×4개만 나오고, 바닥 타일 좌표(최대 256)가
// 캔버스 밖으로 넘어가 타일링 이음새에 빈 영역이 드러난다.
function finishTex(t,rep){
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=Q.aniso===0?MAX_ANISO:Math.min(Q.aniso,MAX_ANISO);
  if(rep)t.repeat.set(rep,rep);
  return t;
}

// 잘라낸 돌벽돌(cut stone) — 줄눈 + 이끼 얼룩 + 거친 표면
function makeDungeonWall(size){
  const w=size,h=size,s=size/256,px=Math.max(1,s);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');

  // 기본 돌 색상 (청회색 계열)
  ctx.fillStyle='#2e3340';ctx.fillRect(0,0,w,h);

  // 벽돌 블록 패턴
  const bW=64*s,bH=32*s; // 벽돌 크기
  for(let row=0;row<Math.ceil(h/bH)+1;row++){
    const offset=(row%2)*bW/2;
    for(let col=-1;col<Math.ceil(w/bW)+1;col++){
      const x=col*bW+offset,y=row*bH;
      // 각 벽돌 색 미세 변화
      const v=Math.floor(Math.random()*18-9);
      const r=46+v,g=51+v,b=64+v;
      ctx.fillStyle=`rgb(${r},${g},${b})`;
      ctx.fillRect(x+px,y+px,bW-2*px,bH-2*px);
      // 벽돌 내부 음영 (입체감)
      ctx.fillStyle='rgba(0,0,0,0.18)';
      ctx.fillRect(x+px,y+bH-4*s,bW-2*px,Math.max(1,3*s));
      ctx.fillStyle='rgba(255,255,255,0.04)';
      ctx.fillRect(x+px,y+px,bW-2*px,Math.max(1,3*s));
    }
  }
  // 줄눈 (mortar lines) — 어두운 회색
  ctx.strokeStyle='#141820';ctx.lineWidth=Math.max(1,2*s);
  for(let row=0;row<Math.ceil(h/bH)+1;row++){
    const offset=(row%2)*bW/2;
    // 가로줄
    ctx.beginPath();ctx.moveTo(0,row*bH);ctx.lineTo(w,row*bH);ctx.stroke();
    // 세로줄
    for(let col=-1;col<Math.ceil(w/bW)+2;col++){
      ctx.beginPath();ctx.moveTo(col*bW+offset,row*bH);ctx.lineTo(col*bW+offset,(row+1)*bH);ctx.stroke();
    }
  }
  // 이끼/얼룩 (하단부 집중) — 개수는 면적에 비례
  const moss=Math.max(12,Math.round(60*s*s));
  for(let i=0;i<moss;i++){
    const x=Math.random()*w,y=h*0.4+Math.random()*h*0.6;
    const r2=(3+Math.random()*10)*s;
    const gr=ctx.createRadialGradient(x,y,0,x,y,r2);
    gr.addColorStop(0,'rgba(30,55,25,0.45)');gr.addColorStop(1,'transparent');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r2,0,Math.PI*2);ctx.fill();
  }
  // 습기 얼룩 (세로 방향)
  for(let i=0;i<8;i++){
    const x=Math.random()*w;
    ctx.fillStyle='rgba(10,15,30,0.22)';
    ctx.fillRect(x,Math.random()*h*0.5,(2+Math.random()*3)*s,h*0.4+Math.random()*h*0.3);
  }
  return finishTex(new THREE.CanvasTexture(c),1);
}

function makeDungeonFloor(size){
  const w=size,h=size,s=size/256,px=Math.max(1,s);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#1a1c22';ctx.fillRect(0,0,w,h);
  // 석판 패턴 (불규칙한 사각형) — 256px 기준 좌표에 s를 곱해 사용
  const tiles=[[0,0,48,48],[48,0,40,48],[88,0,56,48],[144,0,50,48],[194,0,62,48],
               [0,48,62,44],[62,48,44,44],[106,48,58,44],[164,48,48,44],[212,48,44,44]];
  for(const[tx0,ty0,tw0,th0] of tiles){
    const tx=tx0*s,ty=ty0*s,tw=tw0*s,th=th0*s;
    const v=Math.floor(Math.random()*12);
    ctx.fillStyle=`rgb(${32+v},${35+v},${44+v})`;
    ctx.fillRect(tx+px,ty+px,tw-2*px,th-2*px);
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(tx+px,ty+th-3*s,tw-2*px,Math.max(1,2*s));
  }
  // 줄눈
  ctx.strokeStyle='#0e1016';ctx.lineWidth=Math.max(1,2*s);
  for(let x=0;x<w;x+=48*s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=48*s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  // 이끼/물때
  const moss=Math.max(8,Math.round(40*s*s));
  for(let i=0;i<moss;i++){
    const x=Math.random()*w,y=Math.random()*h,r=(2+Math.random()*7)*s;
    const gr=ctx.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(20,40,18,0.4)');gr.addColorStop(1,'transparent');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  return finishTex(new THREE.CanvasTexture(c),3);
}

function makeDungeonCeil(size){
  const w=size,h=size,s=size/256;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#111318';ctx.fillRect(0,0,w,h);
  // 거친 돌 천장 — 불규칙 균열
  const blobs=Math.max(40,Math.round(200*s*s));
  for(let i=0;i<blobs;i++){
    const x=Math.random()*w,y=Math.random()*h,r=(1+Math.random()*6)*s;
    const gr=ctx.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(0,0,0,0.35)');gr.addColorStop(1,'transparent');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.strokeStyle='rgba(0,0,0,0.25)';
  const cracks=Math.max(4,Math.round(14*s*s));
  for(let i=0;i<cracks;i++){
    ctx.lineWidth=(.5+Math.random()*1.2)*s;ctx.beginPath();
    let cx=Math.random()*w,cy=Math.random()*h;ctx.moveTo(cx,cy);
    for(let j=0;j<5;j++){cx+=(Math.random()*20-10)*s;cy+=(Math.random()*20-10)*s;ctx.lineTo(cx,cy);}
    ctx.stroke();
  }
  return finishTex(new THREE.CanvasTexture(c),0);
}

// 몬스터 살갗 — 붕대가 감긴 표면. 사지 메시에 타일링해 입히므로 세로로 반복 가능해야 한다.
// (전신을 한 장에 그린 이전 방식은 평면 빌보드 전용이라 관절 구조로 바꾸면서 폐기)
function makeFleshTex(size){
  const s=size/256,w=size,h=size;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  const base=ctx.createLinearGradient(0,0,0,h);
  base.addColorStop(0,'#9c9484');base.addColorStop(.5,'#7e7869');base.addColorStop(1,'#8f8878');
  ctx.fillStyle=base;ctx.fillRect(0,0,w,h);
  // 붕대 — 비스듬히 감긴 띠. 위아래 끝을 맞춰야 이음새가 안 보인다
  const bands=Math.max(6,Math.round(14*s));
  for(let i=0;i<bands;i++){
    const y=i*(h/bands);
    ctx.fillStyle=`rgba(226,220,203,${.06+Math.random()*.16})`;
    ctx.fillRect(0,y,w,(h/bands)*(.35+Math.random()*.4));
    ctx.strokeStyle='rgba(48,42,36,0.28)';ctx.lineWidth=Math.max(1,1.4*s);
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y+2*s);ctx.stroke();
  }
  // 얼룩
  const spots=Math.max(10,Math.round(30*s*s));
  for(let i=0;i<spots;i++){
    const x=Math.random()*w,y=Math.random()*h,r=(4+Math.random()*12)*s;
    const gr=ctx.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(40,26,20,0.42)');gr.addColorStop(1,'transparent');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  return finishTex(new THREE.CanvasTexture(c),1);
}

const wallMap =makeDungeonWall(Q.texSize);
const floorMap=makeDungeonFloor(Q.texSize);
const ceilMap =makeDungeonCeil(Q.texSize);
const fleshMap=makeFleshTex(Q.texSize);

// 재질 팩토리 — LOW/MEDIUM은 MeshPhongMaterial로 대체한다.
// MeshLambertMaterial을 쓰지 않는 이유: r128의 Lambert는 정점 단위(Gouraud) 조명이라
// 세그먼트 1개짜리 BoxGeometry 벽(정점 8개)에서는 횃불 PointLight의 감쇠가 정점에서만
// 계산되어 빛이 사각 얼룩으로 뭉개진다. 이 게임은 횃불 조명이 분위기의 핵심이라 치명적.
// Phong은 픽셀 단위 조명을 유지하면서 Standard의 PBR 연산(BRDF)만 걷어낸다.
function mkMat(o){
  if(Q.matType!=='phong') return new THREE.MeshStandardMaterial(o);
  const p={};
  for(const k of ['map','color','emissive','emissiveIntensity','transparent','opacity','side'])
    if(o[k]!==undefined)p[k]=o[k];
  p.shininess=o.roughness!==undefined?Math.max(2,(1-o.roughness)*60):30;
  p.specular=new THREE.Color((o.metalness||0)>0.4?0x555555:0x111111);
  return new THREE.MeshPhongMaterial(p);
}

// 던전 색상 팔레트 — 청회색/슬레이트
const mWall  =mkMat({map:wallMap, color:0x8892a4,roughness:.88,metalness:.06,emissive:0x05080f,emissiveIntensity:.25});
const mFloor =mkMat({map:floorMap,color:0x555e6e,roughness:.95,metalness:.04,emissive:0x02040a,emissiveIntensity:.12});
const mCeil  =mkMat({map:ceilMap, color:0x333844,roughness:.97,metalness:.02,emissive:0x010208,emissiveIntensity:.08});
const mFlame  =mkMat({color:0xff8800,emissive:0xff6600,emissiveIntensity:3.5,transparent:true,opacity:.92});
const mBrack  =mkMat({color:0x3a3a3a,roughness:.6,metalness:.7}); // 철 브래킷
const mExit   =mkMat({color:0x00ff88,emissive:0x00ff88,emissiveIntensity:1.6,transparent:true,opacity:.88});
const mMonBody=mkMat({map:fleshMap,color:0x8f8879,roughness:.93,emissive:0x120a08,emissiveIntensity:.28});
const mMonFace=mkMat({color:0x15100f,roughness:1});   // 얼굴 자리의 움푹 팬 그늘
const mMonEye =mkMat({color:0xff0000,emissive:0xff0000,emissiveIntensity:3.0});

// 몬스터 골격 치수 (group 원점 기준. group은 월드 y=0.1에 놓이므로 로컬 -0.10이 바닥)
// 사지를 회전축(Group)에 매달아 어깨·팔꿈치·고관절을 각각 돌린다.
// 지오메트리는 모듈 레벨에서 1회만 만들어 모든 몬스터가 공유한다.
const MON_HIP_Y=.78, MON_SHO_Y=1.28, MON_HEAD_Y=1.50;
const gMonTorso=new THREE.CylinderGeometry(.17,.23,.54,7);
const gMonHead =new THREE.SphereGeometry(.16,9,7);
const gMonEye  =new THREE.SphereGeometry(.030,6,6);
const gMonFace =new THREE.SphereGeometry(.115,9,7);
const gMonUpper=new THREE.CylinderGeometry(.055,.045,.40,6);
const gMonFore =new THREE.CylinderGeometry(.045,.032,.42,6);
const gMonLeg  =new THREE.CylinderGeometry(.075,.05,.88,6);

// 회전축 Group을 만들고 그 안에 메시를 길이의 절반만큼 내려 단다.
// 이렇게 해야 Group을 돌렸을 때 관절을 중심으로 회전한다(메시 중앙이 아니라).
function jointLimb(geo,len,parent,x,y,z){
  const pivot=new THREE.Group();
  pivot.position.set(x,y,z||0);
  const mesh=new THREE.Mesh(geo,mMonBody);
  mesh.position.y=-len/2;
  pivot.add(mesh);
  parent.add(pivot);
  return pivot;
}

// ── PLAYER ──
const P={x:CELL,z:CELL,yaw:0,targetYaw:0,vx:0,vz:0,spd:0};
const bob={phase:0,y:0,roll:0};
let lastStep=0,escaped=0;

// ── KEYBOARD ──
const K={f:0,b:0,tL:0,tR:0};
const KM={ArrowUp:'f',w:'f',W:'f',ArrowDown:'b',s:'b',S:'b',ArrowLeft:'tL',a:'tL',A:'tL',ArrowRight:'tR',d:'tR',D:'tR'};
document.addEventListener('keydown',e=>{const k=KM[e.key];if(k){K[k]=1;e.preventDefault();}});
document.addEventListener('keyup',  e=>{const k=KM[e.key];if(k)K[k]=0;});

// ── D-PAD (좌측) — 전진/후진 + 좌우 횡이동 ──
let jFwd=0, dSide=0; // jFwd: 전진 버튼=-1, 후진 버튼=1 (게임 루프에서 -jFwd로 반전해 사용) / dSide: -1(좌횡이동)~1(우횡이동)
function bindDPad(id, onDown, onUp){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();el.classList.add('active');onDown();},{passive:false});
  el.addEventListener('touchend',  e=>{e.preventDefault();el.classList.remove('active');onUp();},{passive:false});
  el.addEventListener('touchcancel',e=>{e.preventDefault();el.classList.remove('active');onUp();},{passive:false});
  // 데스크톱 테스트용 마우스 지원
  el.addEventListener('mousedown',()=>{el.classList.add('active');onDown();});
  el.addEventListener('mouseup',  ()=>{el.classList.remove('active');onUp();});
  el.addEventListener('mouseleave',()=>{el.classList.remove('active');onUp();});
}
bindDPad('btnFwd',  ()=>jFwd=-1, ()=>{if(jFwd===-1)jFwd=0;});
bindDPad('btnBack',  ()=>jFwd=1,  ()=>{if(jFwd===1)jFwd=0;});
bindDPad('btnLeft', ()=>dSide=-1,()=>{if(dSide===-1)dSide=0;});
bindDPad('btnRight',()=>dSide=1, ()=>{if(dSide===1)dSide=0;});

// ── LOOK ZONE (우측) — 좌우 스와이프로 회전 (원래 방식으로 복귀) ──
const lZone=document.getElementById('lZone');
let lId=-1, lLastX=0;
lZone.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];lId=t.identifier;lLastX=t.clientX;},{passive:false});
lZone.addEventListener('touchmove', e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===lId){P.yaw-=(t.clientX-lLastX)*0.011;lLastX=t.clientX;}},{passive:false});
lZone.addEventListener('touchend',  e=>{for(const t of e.changedTouches)if(t.identifier===lId)lId=-1;},{passive:false});

// ── WORLD ──
let mazeGrid=[],exitPos={x:MW-2,z:MH-2};
const worldObjs=[],torchFlames=[];
// 횃불 광원은 개별 생성하지 않고 "데이터"로만 보관 → 가장 가까운 N개만 실제 광원으로 배치
const torchData=[];              // {x,y,z,phase}
const torchLightPool=[];         // 재사용되는 실제 PointLight (개수 = MAX_TORCH_LIGHTS)
let MAX_TORCH_LIGHTS=Q.torchLights;   // ★ 품질 프리셋이 정함 (LOW 2 / MED 3 / HIGH 4 / ULTRA 6)
const TORCH_RANGE=Q.torchRange;  // 광원 유효 반경 (이 밖은 어차피 기여 0). 광원이 적을수록 넓힌다
let cachedPortal=null,cachedExitLight=null;
function isWall(gx,gz){if(gx<0||gz<0||gx>=MW||gz>=MH)return true;return mazeGrid[gz][gx]===0;}
function addO(o){scene.add(o);worldObjs.push(o);return o;}

// 광원 풀 생성 (씬에 상주, 레벨이 바뀌어도 재사용)
function initTorchLightPool(){
  for(const l of torchLightPool){scene.remove(l);}
  torchLightPool.length=0;
  for(let i=0;i<MAX_TORCH_LIGHTS;i++){
    const l=new THREE.PointLight(0xff9933,0,TORCH_RANGE);
    l.position.set(0,-999,0);   // 처음엔 씬 밖
    scene.add(l);
    torchLightPool.push(l);
  }
}

// 매 프레임 호출: 플레이어에게 가장 가까운 횃불에 광원 풀을 배치
let _torchUpdT=0;
function updateTorchLights(dt,t){
  _torchUpdT-=dt;
  if(_torchUpdT>0) return;      // 프리셋별 주기마다만 재배치 (충분히 부드러움)
  _torchUpdT=Q.torchInterval;

  // 유효 반경 안에 있는 횃불만 후보로 추림
  const cands=[];
  const R2=(TORCH_RANGE+CELL)*(TORCH_RANGE+CELL);
  for(let i=0;i<torchData.length;i++){
    const td=torchData[i];
    const dx=td.x-P.x, dz=td.z-P.z;
    const d2=dx*dx+dz*dz;
    if(d2<R2) cands.push({d2,td});
  }
  cands.sort((a,b)=>a.d2-b.d2);

  for(let i=0;i<torchLightPool.length;i++){
    const l=torchLightPool[i];
    if(i<cands.length){
      const td=cands[i].td;
      l.position.set(td.x,td.y,td.z);
      l.userData.td=td;
      l.userData.on=true;
    }else{
      // 남는 광원은 끄되 visible은 건드리지 않음
      // (Three.js는 보이는 광원 "개수"가 바뀌면 셰이더를 재컴파일하므로 개수는 항상 고정 유지)
      l.position.set(0,-9999,0);
      l.intensity=0;
      l.userData.on=false;
    }
  }
}

function placeTorch(wx,wz,fdx,fdz){
  const bx=wx+fdx*(CELL/2-.05),bz=wz+fdz*(CELL/2-.05);
  addO(new THREE.Mesh(new THREE.BoxGeometry(.08,.26,.08),mBrack)).position.set(bx,1.55,bz);
  const st=addO(new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.32,8),mBrack));
  st.rotation.x=fdz!==0?Math.PI/2.1:0;st.rotation.z=fdx!==0?Math.PI/2.1:0;
  st.position.set(bx+fdx*.1,1.7,bz+fdz*.1);
  const fl=addO(new THREE.Mesh(new THREE.ConeGeometry(.1,.26,8),mFlame));
  fl.position.set(bx+fdx*.1,1.92,bz+fdz*.1);torchFlames.push(fl);
  addO(new THREE.Mesh(new THREE.SphereGeometry(.055,6,6),
    mkMat({color:0xffee88,emissive:0xffdd44,emissiveIntensity:4,transparent:true,opacity:.8})
  )).position.copy(fl.position);
  // 실제 PointLight를 만들지 않고 위치 데이터만 등록
  torchData.push({x:bx+fdx*.1, y:1.98, z:bz+fdz*.1, phase:Math.random()*Math.PI*2});
}

function buildWorld(){
  worldObjs.forEach(o=>scene.remove(o));worldObjs.length=0;torchFlames.length=0;torchData.length=0;
  const gW=new THREE.BoxGeometry(CELL,WALL_H,CELL);
  const gF=new THREE.BoxGeometry(CELL,.1,CELL);
  const gC=new THREE.BoxGeometry(CELL,.1,CELL);
  const FACES=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let row=0;row<MH;row++)for(let col=0;col<MW;col++){
    const wx=col*CELL,wz=row*CELL,h=col*31+row*17;
    if(mazeGrid[row][col]===0){
      addO(new THREE.Mesh(gW,mWall)).position.set(wx,WALL_H/2,wz);
      if(h%5===0)for(const[fdx,fdz]of FACES){
        const nx=col+fdx,nz=row+fdz;
        if(nx>=0&&nz>=0&&nx<MW&&nz<MH&&mazeGrid[nz][nx]===1){placeTorch(wx,wz,fdx,fdz);break;}
      }
    }else{
      addO(new THREE.Mesh(gF,mFloor)).position.set(wx,-.05,wz);
      addO(new THREE.Mesh(gC,mCeil)).position.set(wx,WALL_H+.05,wz);
    }
  }
  const ep=addO(new THREE.Mesh(new THREE.BoxGeometry(1.1,1.9,.12),mExit));
  ep.position.set(exitPos.x*CELL,WALL_H/2-.3,exitPos.z*CELL);ep.userData.isPortal=true;
  cachedPortal=ep;
  const el=new THREE.PointLight(0x00ff88,5,CELL*1.5,2);
  el.position.set(exitPos.x*CELL,1.2,exitPos.z*CELL);el.userData.isExitLight=true;addO(el);
  cachedExitLight=el;
  const ring=addO(new THREE.Mesh(new THREE.RingGeometry(.6,.76,24),
    mkMat({color:0x00ff88,emissive:0x00ff88,emissiveIntensity:2,side:THREE.DoubleSide})));
  ring.rotation.x=-Math.PI/2;ring.position.set(exitPos.x*CELL,.015,exitPos.z*CELL);

  initTorchLightPool();   // 횃불 광원 풀 생성 (개수 고정)
}

// ── COLLISION ──
function blocked(nx,nz){
  for(const[ox,oz]of[[-PLAYER_R,-PLAYER_R],[PLAYER_R,-PLAYER_R],[-PLAYER_R,PLAYER_R],[PLAYER_R,PLAYER_R]])
    if(isWall(Math.round((nx+ox)/CELL),Math.round((nz+oz)/CELL)))return true;
  return false;
}

// ── BFS ──
// BFS용 버퍼를 전역에서 1회만 할당하고 재사용 — 매 호출마다 GC 압박 유발하던 재할당 제거
const _bfsVis=new Uint8Array(MW*MH);
const _bfsPar=new Int16Array(MW*MH);
const _bfsQx=new Int16Array(MW*MH); // 큐를 배열 push/shift 대신 순환 버퍼로 처리 (shift()의 O(n) 비용 제거)
const _bfsQz=new Int16Array(MW*MH);

function bfsNext(sx,sz,tx,tz){
  if(sx===tx&&sz===tz)return null;
  if(!Number.isFinite(sx)||!Number.isFinite(sz)||!Number.isFinite(tx)||!Number.isFinite(tz))return null;
  if(sx<0||sz<0||sx>=MW||sz>=MH||tx<0||tz<0||tx>=MW||tz>=MH)return null;
  if(mazeGrid[sz][sx]===0||mazeGrid[tz][tx]===0)return null;

  _bfsVis.fill(0); _bfsPar.fill(-1);
  const idx=(x,z)=>z*MW+x;
  const startIdx=idx(sx,sz);
  let qHead=0, qTail=0;
  _bfsQx[qTail]=sx; _bfsQz[qTail]=sz; qTail++;
  _bfsVis[startIdx]=1;
  let found=false;
  outer:while(qHead<qTail){
    const cx=_bfsQx[qHead], cz=_bfsQz[qHead]; qHead++;
    for(const[dx,dz]of[[0,-1],[0,1],[-1,0],[1,0]]){
      const nx=cx+dx,nz=cz+dz;
      if(nx<0||nz<0||nx>=MW||nz>=MH||mazeGrid[nz][nx]===0||_bfsVis[idx(nx,nz)])continue;
      _bfsVis[idx(nx,nz)]=1;_bfsPar[idx(nx,nz)]=idx(cx,cz);
      if(nx===tx&&nz===tz){found=true;break outer;}
      _bfsQx[qTail]=nx; _bfsQz[qTail]=nz; qTail++;
    }
  }
  if(!found)return null;

  let cur=idx(tx,tz),prev=cur,guard=MW*MH+2;
  while(cur!==startIdx&&_bfsPar[cur]!==-1&&guard-->0){prev=cur;cur=_bfsPar[cur];}
  if(cur!==startIdx&&_bfsPar[cur]===-1)return null;
  const nx=prev%MW, nz=Math.floor(prev/MW);
  if(!Number.isFinite(nx)||!Number.isFinite(nz))return null;
  return[nx,nz];
}

// ── LOS ──
function hasLOS(ax,az,bx,bz){
  const dx=bx-ax,dz=bz-az,dist=Math.max(Math.abs(dx),Math.abs(dz));
  if(dist===0)return true;
  const steps=Math.ceil(dist*6),sx=dx/steps,sz=dz/steps;
  let cx=ax,cz=az;
  for(let i=0;i<steps;i++){
    cx+=sx;cz+=sz;
    const igx=Math.round(cx),igz=Math.round(cz);
    if(igx===bx&&igz===bz)return true;
    if(isWall(igx,igz))return false;
  }
  return true;
}

// ── MONSTER CLASS ──
class Monster{
  constructor(gx,gz,spd){
    this.stepPhase=Math.random()*Math.PI*2;   // 발소리 타이밍 (몬스터마다 다르게)
    this.gx=gx;this.gz=gz;this.wx=gx*CELL;this.wz=gz*CELL;this.spd=spd;
    this.state='patrol';this.path=null;this.patrolTarget=null;
    this.searchPos=null;this.searchTimer=0;this.alertTimer=0;
    this.chargeT=0;this.snarlT=0;

    // mesh — 관절 구조. 팔은 어깨·팔꿈치 2단이라 휘저을 때 꺾인다.
    this.group=new THREE.Group();
    this.anim=Math.random()*Math.PI*2;   // 개체마다 다른 위상으로 시작
    this.facing=0;

    const torso=new THREE.Mesh(gMonTorso,mMonBody);
    torso.position.y=(MON_HIP_Y+MON_SHO_Y)/2;
    torso.rotation.x=0.16;               // 앞으로 굽은 자세
    this.group.add(torso);

    // 머리는 회전축(head) 안에 메시·얼굴·눈을 형제로 넣는다. 두개골 메시에 준 비균등
    // 스케일(.92,1.22,.92)이 자식으로 상속되면 얼굴과 눈이 같이 일그러지기 때문이다.
    this.head=new THREE.Group();
    this.head.position.y=MON_HEAD_Y;
    this.group.add(this.head);

    const skull=new THREE.Mesh(gMonHead,mMonBody);
    skull.scale.set(.92,1.22,.92);        // 갸름한 달걀형
    this.head.add(skull);

    // 이목구비 없이 움푹 팬 그늘만
    const face=new THREE.Mesh(gMonFace,mMonFace);
    face.position.z=.075;
    face.scale.set(1,1.05,.5);
    this.head.add(face);

    // 눈은 두개골 표면보다 확실히 앞에 둬야 한다. 머리는 z축으로 .92배 눌려 반지름이
    // 약 .147이고 x=±.055 지점의 표면 z는 약 .137이라, 그보다 안쪽이면 파묻혀 안 보인다.
    const eyeL=new THREE.Mesh(gMonEye,mMonEye.clone());
    eyeL.position.set(-.055,.005,.155);
    const eyeR=new THREE.Mesh(gMonEye,mMonEye.clone());
    eyeR.position.set(.055,.005,.155);
    this.eyes=[eyeL,eyeR];   // children 인덱스 대신 직접 참조 — 메시 구성이 바뀌어도 안전
    this.head.add(eyeL,eyeR);

    // 팔 — 무릎 근처까지 내려오는 비정상적인 길이
    // 어깨 축은 몸통 윗반지름(.17) 안쪽에 둔다. 밖으로 빼면 팔을 들었을 때 틈이 벌어진다
    this.armL=jointLimb(gMonUpper,.40,this.group,-.165,MON_SHO_Y);
    this.armR=jointLimb(gMonUpper,.40,this.group, .165,MON_SHO_Y);
    this.foreL=jointLimb(gMonFore,.42,this.armL,0,-.40);
    this.foreR=jointLimb(gMonFore,.42,this.armR,0,-.40);
    this.legL=jointLimb(gMonLeg,.88,this.group,-.10,MON_HIP_Y);
    this.legR=jointLimb(gMonLeg,.88,this.group, .10,MON_HIP_Y);
    this.group.position.set(this.wx,.1,this.wz);
    scene.add(this.group);worldObjs.push(this.group);
    // 눈 광원은 몬스터마다 만들지 않는다 — monLightPool이 최근접 N마리에만 배치 (아래 참조)
  }

  seesPlayer(){
    const pgx=Math.round(P.x/CELL),pgz=Math.round(P.z/CELL);
    const dx=pgx-this.gx,dz=pgz-this.gz;
    if(dx*dx+dz*dz>MON_SIGHT_R*MON_SIGHT_R)return false;
    return hasLOS(this.gx,this.gz,pgx,pgz);
  }
  hearsPlayer(){
    if(P.spd<1.5)return false;
    const pgx=Math.round(P.x/CELL),pgz=Math.round(P.z/CELL);
    const dx=pgx-this.gx,dz=pgz-this.gz;
    return dx*dx+dz*dz<=MON_HEAR_R*MON_HEAR_R;
  }
  pickPatrol(){
    for(let i=0;i<30;i++){
      const rx=1+2*(0|Math.random()*((MW-1)/2));
      const rz=1+2*(0|Math.random()*((MH-1)/2));
      if(mazeGrid[rz]&&mazeGrid[rz][rx]===1&&(rx!==this.gx||rz!==this.gz)){this.patrolTarget=[rx,rz];return;}
    }
  }
  // 발각 순간 — 비명을 지르고 잠깐 달려든다
  onSpotted(){
    playShriek(this.wx,this.wz);
    flashSpot();
    this.chargeT=CHARGE_TIME;
    this.snarlT=0.9;          // 비명 직후 곧바로 으르렁이 겹치지 않게 한 박자 띄운다
  }
  update(dt,lv,t){
    const pgx=Math.round(P.x/CELL),pgz=Math.round(P.z/CELL);
    const sees=this.seesPlayer(),hears=this.hearsPlayer();

    if(this.state==='patrol'){
      if(sees||hears){
        this.state='chase';this.alertTimer=0;
        this.searchPos=[pgx,pgz]; // chase 진입 즉시 위치 기록 — searchPos null 방지
        this.onSpotted();
      }
      else{
        if(!this.patrolTarget||(this.gx===this.patrolTarget[0]&&this.gz===this.patrolTarget[1]))this.pickPatrol();
        this.alertTimer-=dt;
        if(this.alertTimer<=0&&this.patrolTarget){this.path=bfsNext(this.gx,this.gz,this.patrolTarget[0],this.patrolTarget[1]);this.alertTimer=1.2;}
      }
    }else if(this.state==='chase'){
      this.searchPos=[pgx,pgz]; // chase 중엔 매 프레임 최신 위치 유지
      if(sees){
        this.alertTimer-=dt;
        if(this.alertTimer<=0){this.path=bfsNext(this.gx,this.gz,pgx,pgz);this.alertTimer=0.45;}
      }else{
        this.state='search';this.searchTimer=8+Math.random()*4;
        this.path=bfsNext(this.gx,this.gz,this.searchPos[0],this.searchPos[1]);
      }
    }else{// search
      this.searchTimer-=dt;
      if(sees||hears){this.state='chase';this.alertTimer=0;this.onSpotted();}
      else if(!this.searchPos||this.searchTimer<=0){
        // searchPos가 애초에 없거나(청각 감지 등) 타이머 만료 — 순찰로 복귀
        this.state='patrol';this.path=null;this.patrolTarget=null;this.searchPos=null;
      }
      else if(!this.path||(this.gx===this.searchPos[0]&&this.gz===this.searchPos[1])){
        for(let i=0;i<20;i++){
          const ox=Math.round(Math.random()*6-3),oz=Math.round(Math.random()*6-3);
          const nx=(this.searchPos[0]+ox),nz=(this.searchPos[1]+oz);
          if(nx>=0&&nz>=0&&nx<MW&&nz<MH&&mazeGrid[nz][nx]===1){this.path=bfsNext(this.gx,this.gz,nx,nz);break;}
        }
      }
    }

    // 추격 중에는 주기적으로 으르렁댄다 — 쫓기고 있다는 게 계속 들리도록.
    // 멀리 있는 개체까지 울면 소리가 뭉치므로 가까울 때만 낸다.
    if(this.state==='chase'){
      this.snarlT-=dt;
      if(this.snarlT<=0){
        this.snarlT=SNARL_MIN+Math.random()*SNARL_VAR;
        const dxS=this.wx-P.x,dzS=this.wz-P.z;
        if(dxS*dxS+dzS*dzS < 18*18) playGrowl(this.wx,this.wz);
      }
    }

    // move — 발각 직후 CHARGE_TIME 동안 달려든다
    this.chargeT-=dt;
    const charge=this.chargeT>0?CHARGE_BOOST:1;
    const spd=this.state==='chase'?this.spd*(1+0.05*lv)*charge:this.spd*0.55;
    if(this.path){
      const[tgx,tgz]=this.path;
      // NaN/유효하지 않은 좌표 방어 — bfsNext 실패 시 path를 즉시 폐기
      if(!Number.isFinite(tgx)||!Number.isFinite(tgz)||tgx<0||tgz<0||tgx>=MW||tgz>=MH){
        this.path=null;
      } else {
        const twx=tgx*CELL,twz=tgz*CELL;
        const dx=twx-this.wx,dz=twz-this.wz,dist=Math.sqrt(dx*dx+dz*dz);
        if(dist<0.1){this.wx=twx;this.wz=twz;this.gx=tgx;this.gz=tgz;this.path=null;this.alertTimer=0;}
        else{
          this.wx+=dx/dist*spd*dt;this.wz+=dz/dist*spd*dt;
          this.facing=Math.atan2(dx,dz);   // 진행 방향 — 실제 회전은 아래에서 부드럽게 따라간다
          // 3D 발소리 — 이동 속도에 비례한 주기로 자기 위치에서 발생
          this.stepPhase += dt * spd * 1.5;
          if(this.stepPhase >= Math.PI){
            this.stepPhase -= Math.PI;
            const ddx=this.wx-P.x, ddz=this.wz-P.z;
            if(ddx*ddx+ddz*ddz < 30*30) monsterStep(this.wx,this.wz);
          }
        }
      }
    }
    // 위치 자체가 이미 NaN이 됐다면 안전한 좌표로 즉시 복구 (렌더러 크래시 방지)
    if(!Number.isFinite(this.wx)||!Number.isFinite(this.wz)){
      this.wx=this.gx*CELL; this.wz=this.gz*CELL;
      if(!Number.isFinite(this.wx)||!Number.isFinite(this.wz)){this.wx=CELL;this.wz=CELL;this.gx=1;this.gz=1;}
    }
    // ── 사지 애니메이션 ──
    // 임팩트는 실루엣이 아니라 움직임에서 나온다. 추격 중에는 진폭·속도를 크게 올려
    // 팔을 정신없이 휘젓게 하고, 순찰 중에는 축 늘어진 채 느리게 흔들리게 한다.
    const chasing=this.state==='chase';
    this.anim+=dt*(chasing?(this.chargeT>0?12.5:9.5):3.6);   // 돌진 중엔 더 정신없이
    const a=this.anim, sw=Math.sin(a), sw2=Math.sin(a*1.73+1.1), sw3=Math.sin(a*2.4);
    const amp=chasing?1.25:0.30;

    this.armL.rotation.x= sw*amp;                    // 앞뒤로 젓기 (좌우 반대 위상)
    this.armR.rotation.x=-sw*amp;
    this.armL.rotation.z= .22+(chasing? sw2*.75:0);  // 추격 시 옆으로도 벌어져 허우적거린다
    this.armR.rotation.z=-.22-(chasing? sw2*.75:0);
    this.foreL.rotation.x=chasing?-1.1+sw3*.85:-.34; // 팔꿈치 꺾임
    this.foreR.rotation.x=chasing?-1.1-sw3*.85:-.30;
    this.legL.rotation.x=-sw*(chasing?.62:.20);
    this.legR.rotation.x= sw*(chasing?.62:.20);
    this.head.rotation.z=sw2*(chasing?.26:.10);      // 고개를 가누지 못하는 느낌
    this.head.rotation.x=chasing?.22:.10;

    // 걸을 때 상하로 튀는 반동
    this.group.position.set(this.wx,.1+Math.abs(sw)*(chasing?.055:.018),this.wz);

    // 진행 방향을 바라본다. 각도차를 -π~π로 감아 최단 경로로 회전시켜야
    // ±π 경계에서 한 바퀴 헛도는 것을 막을 수 있다.
    let d=this.facing-this.group.rotation.y;
    while(d> Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;
    this.group.rotation.y+=d*Math.min(1,dt*9);

    const ei=this.state==='chase'?3+Math.sin(t*8):1.5;
    this.eyes[0].material.emissiveIntensity=ei;
    this.eyes[1].material.emissiveIntensity=ei;
  }
  distToPlayer(){const dx=this.wx-P.x,dz=this.wz-P.z;return Math.sqrt(dx*dx+dz*dz);}
  remove(){scene.remove(this.group);}
}
let monsters=[];

// 몬스터 눈 광원 풀 — 횃불과 동일한 패턴.
// 개수는 부팅 시 Q.monLights로 고정하고 씬에 상주시킨다(레벨이 바뀌어도 제거하지 않음).
// 몬스터 수에 맞춰 늘렸다 줄였다 하면 레벨 전환마다 셰이더가 재컴파일된다.
const monLightPool=[];
for(let i=0;i<Q.monLights;i++){
  const l=new THREE.PointLight(0xff0000,0,3.5);
  l.position.set(0,-9999,0);
  scene.add(l);
  monLightPool.push(l);
}
function updateMonsterLights(t){
  if(!monLightPool.length)return;
  // 가장 가까운 순으로 정렬해 앞쪽 N마리에만 광원을 붙인다
  const cands=[];
  for(const m of monsters){
    const dx=m.wx-P.x,dz=m.wz-P.z;
    cands.push({d2:dx*dx+dz*dz,m});
  }
  cands.sort((a,b)=>a.d2-b.d2);
  for(let i=0;i<monLightPool.length;i++){
    const l=monLightPool[i];
    if(i<cands.length&&cands[i].d2<5.5*5.5){
      const m=cands[i].m;
      l.position.set(m.wx,1.3,m.wz);
      l.intensity=m.state==='chase'?2.0+Math.sin(t*8)*.8:.7+Math.sin(t*2)*.3;
    }else{
      // 유효 반경 밖이면 세기만 0으로 (visible은 건드리지 않음 — 광원 개수 고정 유지)
      l.position.set(0,-9999,0);
      l.intensity=0;
    }
  }
}

// ── AUDIO (3D 공간 오디오) ──
let actx=null, masterGain=null, audioReady=false;

function getAC(){
  if(!actx){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=actx.createGain();
    masterGain.gain.value=0.9;
    masterGain.connect(actx.destination);
  }
  return actx;
}

// iOS는 사용자 제스처 안에서 resume()해야 소리가 납니다
function unlockAudio(){
  try{
    const c=getAC();
    if(c.state==='suspended') c.resume();
    audioReady=true;
    loadShriek();   // 비명 음원 디코드 (1회)
  }catch(_){}
}

// 리스너(=플레이어 귀)를 카메라 위치/방향에 동기화
function updateAudioListener(){
  if(!actx) return;
  const l=actx.listener;
  const fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw);
  try{
    if(l.positionX){
      // 최신 브라우저: AudioParam 방식
      l.positionX.value=P.x; l.positionY.value=1.22; l.positionZ.value=P.z;
      l.forwardX.value=fx;   l.forwardY.value=0;    l.forwardZ.value=fz;
      l.upX.value=0;         l.upY.value=1;         l.upZ.value=0;
    }else{
      // 구형 API 폴백 (iOS Safari 일부 버전)
      l.setPosition(P.x,1.22,P.z);
      l.setOrientation(fx,0,fz, 0,1,0);
    }
  }catch(_){}
}

// 3D 위치를 가진 출력 노드 생성
function makePanner(x,y,z,refDist,maxDist,rolloff){
  const c=getAC();
  const p=c.createPanner();
  p.panningModel=Q.panning;     // HRTF=머리전달함수(방향감 우수) / LOW는 equalpower로 CPU 절감
  p.distanceModel='inverse';
  p.refDistance=refDist||1.8;
  p.maxDistance=maxDist||28;
  p.rolloffFactor=rolloff||1.5;
  try{
    if(p.positionX){p.positionX.value=x;p.positionY.value=y;p.positionZ.value=z;}
    else p.setPosition(x,y,z);
  }catch(_){}
  p.connect(masterGain);
  return p;
}

// 노이즈 버스트 버퍼 (발소리용) — 미리 만들어두고 재사용
let _noiseBuf=null;
function getNoiseBuf(){
  const c=getAC();
  if(!_noiseBuf){
    const len=Math.floor(c.sampleRate*0.09);
    _noiseBuf=c.createBuffer(1,len,c.sampleRate);
    const d=_noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(len*0.26));
  }
  return _noiseBuf;
}

// 플레이어 발소리 — 자기 발이므로 위치 없이 그대로 (2D)
function footstep(){
  try{
    const c=getAC();
    const src=c.createBufferSource();src.buffer=getNoiseBuf();
    src.playbackRate.value=0.9+Math.random()*0.25;
    const g=c.createGain();g.gain.value=.06;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=150+Math.random()*80;
    src.connect(f);f.connect(g);g.connect(masterGain);src.start();
  }catch(_){}
}

// 몬스터 발소리 — 3D 위치 지정 (묵직하게)
function monsterStep(x,z){
  try{
    const c=getAC();
    const src=c.createBufferSource();src.buffer=getNoiseBuf();
    src.playbackRate.value=0.5+Math.random()*0.15;   // 낮게 = 무거운 발소리
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=320+Math.random()*120;
    const g=c.createGain();g.gain.value=.5;
    const p=makePanner(x,0.4,z, 1.8, 26, 1.7);   // 거리에 따라 확실히 줄어들게
    src.connect(f);f.connect(g);g.connect(p);
    src.start();
    src.onended=()=>{try{p.disconnect();g.disconnect();f.disconnect();}catch(_){}};
  }catch(_){}
}

// 으르렁 — 몬스터 위치에서 발생
function playGrowl(x,z){
  try{
    const c=getAC();
    const o=c.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(58+Math.random()*18,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(38,c.currentTime+.75);
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=220;
    const g=c.createGain();
    g.gain.setValueAtTime(.55,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.85);
    const dest = (x!==undefined) ? makePanner(x,1.0,z, 2.2, 34, 1.8) : masterGain;
    o.connect(f);f.connect(g);g.connect(dest);
    o.start();o.stop(c.currentTime+.85);
    o.onended=()=>{try{if(dest!==masterGain)dest.disconnect();g.disconnect();f.disconnect();}catch(_){}};
  }catch(_){}
}

// 횃불 탁탁거리는 소리 — 가장 가까운 횃불에서 가끔
function torchCrackle(x,y,z){
  try{
    const c=getAC();
    const src=c.createBufferSource();src.buffer=getNoiseBuf();
    src.playbackRate.value=1.8+Math.random()*1.2;
    const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=1800;
    const g=c.createGain();g.gain.value=.28;
    const p=makePanner(x,y,z, 1.2, 12, 2.2);
    src.connect(f);f.connect(g);g.connect(p);
    src.start();
    src.onended=()=>{try{p.disconnect();g.disconnect();f.disconnect();}catch(_){}};
  }catch(_){}
}


// 발각 순간의 비명 — 녹음 음원 2종(mono 44.1kHz MP3)을 base64로 심어 둔다.

let _shriekBufs=[],_shriekTried=false;
// 몬스터가 최대 3마리라 각자 발각되면 비명이 겹쳐 뭉갠다. 하나가 끝날 때까지 막는다.
let _shriekBusyUntil=0;

// AudioContext는 사용자 제스처 안에서만 열리므로 unlockAudio() 시점에 한 번 디코드한다
function loadShriek(){
  if(_shriekTried) return;
  _shriekTried=true;
  try{
    const c=getAC();
    SHRIEK_MP3.forEach((uri,idx)=>{
      const bin=atob(uri.slice(uri.indexOf(',')+1));
      const arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      c.decodeAudioData(arr.buffer,
        b=>{_shriekBufs.push(b);},
        e=>{console.warn('[SHRIEK] '+idx+' 디코드 실패 — 합성음으로 대체',e);});
    });
  }catch(e){console.warn('[SHRIEK] 로드 실패 — 합성음으로 대체',e);}
}

function playShriek(x,z){
  try{
    const c=getAC();
    if(c.currentTime<_shriekBusyUntil) return;      // 이미 다른 개체가 울고 있다
    if(!_shriekBufs.length){
      _shriekBusyUntil=c.currentTime+0.65+SHRIEK_GAP;
      return playShriekSynth(x,z);                  // 디코드 실패/미완료 시 폴백
    }
    const buf=_shriekBufs[(Math.random()*_shriekBufs.length)|0];
    const rate=0.94+Math.random()*0.12;             // 매번 미묘하게 다르게
    _shriekBusyUntil=c.currentTime+buf.duration/rate+SHRIEK_GAP;
    const src=c.createBufferSource();src.buffer=buf;
    src.playbackRate.value=rate;
    const g=c.createGain();g.gain.value=SHRIEK_GAIN;
    const p=makePanner(x,1.3,z, 2.2, 40, 1.9);      // 멀면 확실히 작아지도록 rolloff를 세게
    src.connect(g);g.connect(p);
    src.start();
    src.onended=()=>{try{p.disconnect();g.disconnect();}catch(_){}};
  }catch(_){}
}

// 합성 폴백 — 톱니 2개를 완전5도로 겹쳐 위에서 아래로 훑어내린다
function playShriekSynth(x,z){
  try{
    const c=getAC();
    const t0=c.currentTime;
    const g=c.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(.42,t0+.03);
    g.gain.exponentialRampToValueAtTime(.001,t0+.62);
    const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=2.2;
    f.frequency.setValueAtTime(1500,t0);
    f.frequency.exponentialRampToValueAtTime(420,t0+.6);
    const oscs=[[820,1],[1230,.55]].map(([fr,vol])=>{
      const o=c.createOscillator();o.type='sawtooth';
      o.frequency.setValueAtTime(fr,t0);
      o.frequency.exponentialRampToValueAtTime(fr*.32,t0+.6);
      const og=c.createGain();og.gain.value=vol;
      o.connect(og);og.connect(f);
      o.start(t0);o.stop(t0+.65);
      return o;
    });
    const dest=makePanner(x,1.3,z, 3.0, 45, 1.0);
    f.connect(g);g.connect(dest);
    oscs[0].onended=()=>{try{dest.disconnect();g.disconnect();f.disconnect();}catch(_){}};
  }catch(_){}
}

// 심장박동 — 몬스터가 아주 가까울 때 (2D, 플레이어 자신의 것)
let _lastHeartbeat=0;
function heartbeat(intensity){
  try{
    const c=getAC();
    const o=c.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(62,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(34,c.currentTime+.16);
    const g=c.createGain();
    g.gain.setValueAtTime(0,c.currentTime);
    // 선형이면 멀리서도 또렷이 들린다. 제곱 곡선을 써서 멀 때는 거의 안 들리고
    // 가까워질수록 급격히 커지게 한다 (거리 7칸=0, 1칸=1).
    g.gain.linearRampToValueAtTime(.26*intensity*intensity,c.currentTime+.03);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);
    o.connect(g);g.connect(masterGain);
    o.start();o.stop(c.currentTime+.24);
  }catch(_){}
}

function playDeath(){
  try{const c=getAC();
    [80,60,45].forEach((fr,i)=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=fr;
      const g=c.createGain();g.gain.setValueAtTime(0,c.currentTime+i*.15);
      g.gain.linearRampToValueAtTime(.22,c.currentTime+i*.15+.08);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.15+.6);
      o.connect(g);g.connect(masterGain);o.start(c.currentTime+i*.15);o.stop(c.currentTime+i*.15+.7);});}catch(_){}
}
function playEscape(){
  try{const c=getAC();
    [0,7,12,16].forEach((s,i)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=330*Math.pow(2,s/12);
      const g=c.createGain();g.gain.setValueAtTime(0,c.currentTime+i*.1);
      g.gain.linearRampToValueAtTime(.16,c.currentTime+i*.1+.05);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.1+.5);
      o.connect(g);g.connect(masterGain);o.start(c.currentTime+i*.1);o.stop(c.currentTime+i*.1+.5);});}catch(_){}
}

// ── FOG OF WAR ──
let visited=[];
let _visCount=0;   // 밝혀진 칸 수를 증분으로 유지 — drawMM에서 매번 625칸 세던 루프를 대체
function initVisited(){visited=Array.from({length:MH},()=>new Array(MW).fill(false));_lastVisGx=-999;_lastVisGz=-999;_lastVisYaw=999;_visCount=0;_mmVisitedCount=-1;}
const FOV_COS=Math.cos(60*Math.PI/180);
let _lastVisGx=-999,_lastVisGz=-999,_lastVisYaw=999;
function updateVisibility(){
  const pgx=Math.round(P.x/CELL),pgz=Math.round(P.z/CELL);
  // 같은 칸에 머물고 시야각도 거의 안 바뀌었으면 재계산 스킵 — 매 프레임 25칸 스캔 낭비 제거
  const yawDelta=Math.abs(P.yaw-_lastVisYaw);
  if(pgx===_lastVisGx&&pgz===_lastVisGz&&yawDelta<0.15) return;
  _lastVisGx=pgx;_lastVisGz=pgz;_lastVisYaw=P.yaw;

  if(pgx>=0&&pgz>=0&&pgx<MW&&pgz<MH&&!visited[pgz][pgx]){visited[pgz][pgx]=true;_visCount++;}
  const fwdX=-Math.sin(P.yaw),fwdZ=-Math.cos(P.yaw);
  for(let dz=-2;dz<=2;dz++)for(let dx=-2;dx<=2;dx++){
    if(dx===0&&dz===0)continue;
    if(dx*dx+dz*dz>4)continue;
    const len=Math.sqrt(dx*dx+dz*dz);
    if((dx/len)*fwdX+(dz/len)*fwdZ<FOV_COS)continue;
    const gx=pgx+dx,gz=pgz+dz;
    if(gx<0||gz<0||gx>=MW||gz>=MH)continue;
    if(!visited[gz][gx]&&hasLOS(pgx,pgz,gx,gz)){visited[gz][gx]=true;_visCount++;}
  }
}

const mm=document.getElementById('mmCanvas'),mc=mm.getContext('2d'),MM=110;
// 지형(길/벽) 레이어는 새로 밝혀진 칸이 있을 때만 오프스크린에 갱신 — 매 프레임 625칸 순회 제거
const mmTerrain=document.createElement('canvas');mmTerrain.width=MM;mmTerrain.height=MM;
const mtCtx=mmTerrain.getContext('2d');
let _mmVisitedCount=0;

function redrawTerrainLayer(){
  mtCtx.clearRect(0,0,MM,MM);mtCtx.fillStyle='rgba(0,0,0,.92)';mtCtx.fillRect(0,0,MM,MM);
  const cw=MM/MW,ch=MM/MH;
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++){
    if(!visited[r][c])continue;
    mtCtx.fillStyle=mazeGrid[r][c]===1?'#c8854a':'#2a1e12';
    mtCtx.fillRect(c*cw,r*ch,cw,ch);
  }
  if(visited[exitPos.z]&&visited[exitPos.z][exitPos.x]){
    mtCtx.fillStyle='#0f8';mtCtx.shadowColor='#0f8';mtCtx.shadowBlur=5;
    mtCtx.fillRect(exitPos.x*cw+1,exitPos.z*ch+1,cw-2,ch-2);mtCtx.shadowBlur=0;
  }
  _mmVisitedCount=_visCount;
}

function drawMM(){
  // 새로 밝혀진 칸이 생겼을 때만 지형 레이어 재생성 (_visCount는 updateVisibility가 증분 갱신)
  if(_visCount!==_mmVisitedCount) redrawTerrainLayer();

  const cw=MM/MW,ch=MM/MH;
  mc.clearRect(0,0,MM,MM);
  mc.drawImage(mmTerrain,0,0); // 캐싱된 지형을 그대로 복사 (fillRect 625회 대신 1회 drawImage)

  for(const m of monsters){
    if(!visited[m.gz]||!visited[m.gz][m.gx])continue;
    mc.fillStyle=m.state==='chase'?'#f00':'#800';
    mc.shadowColor='#f00';mc.shadowBlur=4;
    mc.beginPath();mc.arc(m.wx/CELL*cw,m.wz/CELL*ch,Math.max(cw,ch)*.9,0,Math.PI*2);mc.fill();mc.shadowBlur=0;
  }
  const px=P.x/CELL*cw,pz=P.z/CELL*ch;
  mc.fillStyle='#ffaa33';mc.shadowColor='#ff8800';mc.shadowBlur=7;
  mc.beginPath();mc.arc(px,pz,Math.max(cw,ch)*.7,0,Math.PI*2);mc.fill();
  mc.strokeStyle='#ffe';mc.lineWidth=1.5;mc.shadowBlur=0;
  mc.beginPath();mc.moveTo(px,pz);mc.lineTo(px-Math.sin(P.yaw)*cw*1.5,pz-Math.cos(P.yaw)*ch*1.5);mc.stroke();
  mc.strokeStyle='rgba(255,130,30,.4)';mc.lineWidth=1;mc.strokeRect(0,0,MM,MM);
}

// ── SPAWN ──
function findSpawn(idx,total){
  const zones=[[MW-4,MH-4],[1,MH-4],[MW-4,1],[Math.floor(MW/2),Math.floor(MH/2)]];
  const[zx,zz]=zones[idx%zones.length];
  for(let t=0;t<20;t++){
    const gx=Math.max(1,Math.min(MW-2,zx+(Math.random()*4-2|0)));
    const gz=Math.max(1,Math.min(MH-2,zz+(Math.random()*4-2|0)));
    if(mazeGrid[gz]&&mazeGrid[gz][gx]===1)return[gx,gz];
  }
  // 20회 랜덤 시도 실패 시 — 전수 탐색으로 반드시 유효한 길 칸을 찾음 (NaN/벽 스폰 원천 차단)
  for(let r=1;r<MH-1;r++){
    for(let c=1;c<MW-1;c++){
      if(mazeGrid[r][c]===1) return[c,r];
    }
  }
  return[1,1]; // 최후의 보루 — 시작 지점 (항상 길로 보장됨)
}

const perfEl=document.getElementById('perf');
const pFps=document.getElementById('pFps'), pMs=document.getElementById('pMs');
const pMin=document.getElementById('pMin'), pAvg=document.getElementById('pAvg');
const pCalls=document.getElementById('pCalls'), pTris=document.getElementById('pTris');

const pQual=document.getElementById('pQual'), pScale=document.getElementById('pScale');
let perfOn=true;
let _frames=0,_accum=0;                       // 표시 구간(1초) 집계
let _minFps=Infinity;                          // 세션 최저 FPS (계속 유지)
let _totFrames=0,_totTime=0;                   // 세션 전체 평균용
let _worstCalls=0;                             // 세션 최대 draw call

function resetPerfStats(){
  _minFps=Infinity;_totFrames=0;_totTime=0;_worstCalls=0;
  _frames=0;_accum=0;
  // 적응형이 이미 낮춰둔 해상도를 프리셋 기본값으로 되돌린다 — 프리셋별 실측 조건을 맞추기 위함

function cls(v,warn,bad){return v>=bad?'pv bad':v>=warn?'pv warn':'pv';}

// ── 적응형 해상도 조절 ──
// 조절 대상은 renderScale 하나뿐. 광원·재질·텍스처는 절대 건드리지 않는다
// (개수가 바뀌면 셰이더가 재컴파일되어 플레이 중 hitching이 발생한다).
// 하향은 빠르게(3초), 복구는 느리게(10초) — 경계에서 진동하는 것을 막기 위한 히스테리시스.
const ADAPT_MIN=0.5;
let _lowSec=0,_hiSec=0;
function adaptQuality(fps){
  if(!gameActive) return;                       // 타이틀·결과 화면에서는 조절하지 않음
  const target=Q.targetFps;
  if(fps<target){ _lowSec++; _hiSec=0; }
  else if(fps>target*1.15){ _hiSec++; _lowSec=0; }
  else { _lowSec=0; _hiSec=0; }

  if(_lowSec>=3 && renderScale>ADAPT_MIN){
    renderScale=Math.max(ADAPT_MIN,Math.round((renderScale-0.1)*100)/100);
    applyRenderScale(); _lowSec=0;
  }else if(_hiSec>=10 && renderScale<Q.scale){
    renderScale=Math.min(Q.scale,Math.round((renderScale+0.05)*100)/100);
    applyRenderScale(); _hiSec=0;
  }
}

function updatePerf(rawDt){
  if(rawDt<=0) return;

  // 세션 누적 (표시 주기와 무관하게 항상 기록)
  _totFrames++; _totTime+=rawDt;
  _frames++; _accum+=rawDt;

  const info=renderer.info.render;
  if(info.calls>_worstCalls) _worstCalls=info.calls;

  if(_accum<1.0) return;                        // 1초마다만 집계

  const fps=_frames/_accum;
  const ms=(_accum/_frames)*1000;
  _frames=0; _accum=0;

  // 로딩 직후 첫 구간은 튀므로 최저값 집계에서 제외
  if(_totTime>2.0 && fps<_minFps) _minFps=fps;

  adaptQuality(fps);                            // 패널 표시 여부와 무관하게 동작해야 함
  if(!perfOn) return;                           // 이하 DOM 갱신만 스킵

  let lightCount=0,objCount=0;
  scene.traverse(o=>{ if(o.isLight)lightCount++; if(o.isMesh)objCount++; });

  pFps.textContent=fps.toFixed(0);
  pFps.className=fps<30?'pv bad':fps<55?'pv warn':'pv';
  pMs.textContent='('+ms.toFixed(1)+'ms)';

  if(_minFps<Infinity){
    pMin.textContent=_minFps.toFixed(0);
    pMin.className=_minFps<30?'pv bad':_minFps<55?'pv warn':'pv';
  }
  const avg=_totFrames/_totTime;
  pAvg.textContent=avg.toFixed(0);
  pAvg.className=avg<30?'pv bad':avg<55?'pv warn':'pv';

  pCalls.textContent=info.calls;
  pCalls.className=cls(info.calls,150,400);
  pTris.textContent=(info.triangles/1000).toFixed(1)+'k';
  pLights.textContent=lightCount;
  pLights.className=cls(lightCount,9,16);
  pObjs.textContent=objCount;
  pObjs.className=cls(objCount,150,400);

  pQual.textContent=QNAME;
  pScale.textContent='×'+renderScale.toFixed(2);
  pScale.className=renderScale<Q.scale?'pv warn':'pv';
}

// ── GAME LOOP ──
const clock=new THREE.Clock();
let mmTick=0;
function animate(){
  requestAnimationFrame(animate);
  const rawDt=clock.getDelta();          // 클램프 전 실제 프레임 간격 (계측용)
  const dt=Math.min(rawDt,.05);          // 게임 로직용 (물리 폭주 방지)
  const t=clock.elapsedTime;
  try{
    if(gameActive){
      // player move — 회전은 우측 스와이프에서 직접 P.yaw를 갱신(위 lZone 리스너), 키보드 좌우도 함께 반영
      P.yaw+=(K.tL-K.tR)*TURN_SPD*dt;

      const fwd=-(K.f-K.b)+(-jFwd);
      const strafe=dSide; // 좌측 D-pad 좌/우 버튼 — 캐릭터 기준 좌우 횡이동
      const sin=Math.sin(P.yaw),cos=Math.cos(P.yaw);
      // 전방 벡터: (-sin,-cos)  /  우측 벡터: (cos,-sin) — 횡이동은 우측 벡터를 사용
      const dvx=-sin*fwd*PLAYER_SPD + cos*strafe*PLAYER_SPD;
      const dvz=-cos*fwd*PLAYER_SPD - sin*strafe*PLAYER_SPD;
      const bl=Math.min(ACCEL*dt,1);
      P.vx+=(dvx-P.vx)*bl;P.vz+=(dvz-P.vz)*bl;
      if(Math.abs(fwd)<.05&&Math.abs(strafe)<.05){P.vx*=Math.max(0,1-FRIC*dt);P.vz*=Math.max(0,1-FRIC*dt);}
      P.spd=Math.sqrt(P.vx*P.vx+P.vz*P.vz);
      const nx=P.x+P.vx*dt,nz=P.z+P.vz*dt;
      if(!blocked(nx,P.z))P.x=nx;else P.vx*=-.04;
      if(!blocked(P.x,nz))P.z=nz;else P.vz*=-.04;
      // bob
      const moving=P.spd>.25;
      if(moving)bob.phase+=dt*7.2*(P.spd/PLAYER_SPD);else bob.phase+=dt*3.5;
      const hc=0|bob.phase/Math.PI;
      if(moving&&hc!==lastStep){lastStep=hc;footstep();steps++;document.getElementById('hudSt').textContent=steps;}
      bob.y=moving?Math.sin(bob.phase)*.058:Math.sin(bob.phase)*.004;
      bob.roll=moving?Math.sin(bob.phase*.5)*.009:0;
      // camera
      camera.position.set(P.x,1.22+bob.y,P.z);
      camera.rotation.order='YXZ';camera.rotation.y=P.yaw;camera.rotation.x=0;camera.rotation.z=bob.roll;
      // monsters
      for(const m of monsters)m.update(dt,level,t);
      // death check
      for(const m of monsters)if(m.distToPlayer()<MON_KILL_R){onDeath();return;}
      // exit check
      if(Math.round(P.x/CELL)===exitPos.x&&Math.round(P.z/CELL)===exitPos.z){onEscape();return;}
      updateVisibility();
      if((mmTick++%Q.mmInterval)===0)drawMM();
      updateDanger();

      // ── 공간 오디오 ──
      updateAudioListener();          // 귀 위치/방향을 카메라에 동기화

      // 가장 가까운 몬스터 거리에 따라 심장박동 (가까울수록 빠르게)
      let nearest=Infinity;
      for(const m of monsters) nearest=Math.min(nearest,m.distToPlayer());
      if(nearest<7){
        const inten=Math.min(1,(7-nearest)/6);
        const interval=0.95-inten*0.5;   // 가까울수록 짧은 간격
        if(t-_lastHeartbeat>interval){ _lastHeartbeat=t; heartbeat(inten); }
      }

      // 횃불 탁탁 소리 — 활성 광원 중 하나에서 가끔 (초당 약 1.2회)
      if(Math.random()<dt*1.2){
        const on=torchLightPool.filter(l=>l.userData.on);
        if(on.length){
          const l=on[(Math.random()*on.length)|0];
          torchCrackle(l.position.x,l.position.y,l.position.z);
        }
      }
    }
    // 광원 재배치 (가장 가까운 N개만 실제 광원으로 사용)
    updateTorchLights(dt,t);
    updateMonsterLights(t);
    // 활성화된 풀 광원만 깜빡임 적용 (최대 MAX_TORCH_LIGHTS개)
    for(const l of torchLightPool){
      if(!l.userData.on){continue;}
      const ph=l.userData.td?l.userData.td.phase:0;
      l.intensity=Math.max(.5, 2.6
        +Math.sin(t*7.3+ph)*.5 +Math.sin(t*13.1+ph*1.7)*.25
        +Math.sin(t*3.2+ph*.5)*.4 +(Math.random()-.5)*.35)*Q.torchPower;
    }
    for(const fl of torchFlames){
      fl.scale.x=1+Math.sin(t*9+fl.position.x)*.12;
      fl.scale.z=1+Math.sin(t*11+fl.position.z)*.12;
      fl.scale.y=1+Math.sin(t*6+fl.position.z)*.18;
    }
    // 캐싱된 portal/exitLight 직접 참조
    if(cachedPortal){cachedPortal.rotation.y=t*.8;cachedPortal.material.emissiveIntensity=1.2+Math.sin(t*2.8)*.6;}
    if(cachedExitLight){
      const dxE=exitPos.x*CELL-P.x, dzE=exitPos.z*CELL-P.z;
      cachedExitLight.intensity=((dxE*dxE+dzE*dzE)<6*6) ? 4+Math.sin(t*3)*1.5 : 0;
    }
    renderer.render(scene,camera);
    // renderer.info.render는 render() 시작 시 리셋되므로 반드시 렌더 직후에 읽어야 함
    updatePerf(rawDt);
  }catch(err){
    // 예외가 나도 루프를 죽이지 않고 콘솔에만 기록 — 게임이 통째로 멈추는 것 방지
    console.error('[ANIMATE LOOP ERROR]', err);
  }
}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
animate();
showScreen('titleScreen');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
