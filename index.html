<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0808"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>DUNGEON ESCAPE</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png" type="image/png"/>
<link rel="apple-touch-icon" href="icon-512.png"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
/* 노치·홈 인디케이터 여백. viewport-fit=cover로 화면 끝까지 그리는 대신,
   UI는 이 값만큼 안으로 밀어 가려지지 않게 한다. */
:root{--sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);
      --sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);}
body{background:#080a10;overflow:hidden;font-family:'Courier New',monospace;touch-action:none;user-select:none;-webkit-user-select:none;}
#canvas{display:block;width:100vw;height:100vh;}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + var(--sat)) calc(18px + var(--sar)) 12px calc(18px + var(--sal));z-index:10;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,transparent 100%);}
.hud-label{font-size:9px;letter-spacing:3px;color:rgba(255,170,50,.7);text-transform:uppercase;}
.hud-value{font-size:20px;font-weight:bold;color:#ffaa33;text-shadow:0 0 8px #ff8800;letter-spacing:2px;}
.hud-block{text-align:center;}
#mmCanvas{position:fixed;bottom:calc(165px + var(--sab));right:calc(14px + var(--sar));z-index:11;border:1px solid rgba(255,130,30,.35);border-radius:4px;}
/* 성능 계측 오버레이 */
#perf{position:fixed;top:calc(78px + var(--sat));left:calc(12px + var(--sal));z-index:30;pointer-events:none;
      font-family:'Courier New',monospace;font-size:13px;line-height:1.65;
      color:#7fff9f;text-shadow:0 0 4px rgba(0,0,0,.9);
      background:rgba(0,0,0,.72);border:1px solid rgba(120,255,150,.3);
      border-radius:5px;padding:8px 11px;min-width:168px;letter-spacing:.5px;}
#perf.hidden{display:none;}
#perf .pv{color:#fff;font-weight:bold;}
#perf .warn{color:#ffcc44;}
#perf .bad{color:#ff5544;}
#perf .lb{display:inline-block;width:52px;opacity:.65;}
#perf .sep{border-top:1px solid rgba(120,255,150,.2);margin:5px 0;}
#perf .hint{font-size:9px;opacity:.45;letter-spacing:0;}
#perfToggle{position:fixed;top:calc(78px + var(--sat));left:calc(12px + var(--sal));width:172px;height:186px;z-index:31;
            pointer-events:all;background:transparent;}
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.78) 100%);}
#danger{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(180,0,0,.65) 100%);transition:opacity .25s;}
/* z-index는 반드시 #perfToggle(31)보다 높아야 한다. 낮으면 화면이 짧은 가로모드에서
   성능 패널의 투명 터치판이 십자키 위에 겹쳐 버튼 입력을 통째로 삼킨다. */
/* 좌: 이동(플로팅 스틱), 우: 시선. 둘 다 보이지 않는 터치 영역이다.
   z-index는 화면 오버레이(.screen=100)보다 낮고 #perfToggle(31)보다도 낮아야 한다 —
   대신 #touchL을 성능 패널 아래에서 시작시켜 애초에 겹치지 않게 한다. */
#touchL,#touchR{position:fixed;bottom:0;z-index:15;pointer-events:all;touch-action:none;}
#touchL{left:0;width:50%;top:calc(272px + var(--sat));}
#touchR{right:0;width:50%;top:0;}
/* 플로팅 스틱 — 누른 자리에 나타나고 떼면 사라진다 */
#stick{position:fixed;z-index:16;pointer-events:none;width:112px;height:112px;margin:-56px 0 0 -56px;
       border:2px solid rgba(255,160,60,.30);border-radius:50%;background:rgba(255,140,40,.05);
       opacity:0;transition:opacity .13s;}
#stick.on{opacity:1;}
#stickKnob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;
           border-radius:50%;background:rgba(255,150,50,.26);border:1px solid rgba(255,175,80,.45);
           box-shadow:0 0 12px rgba(255,120,30,.35);}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--sat) var(--sar) var(--sab) var(--sal);background:rgba(0,0,0,.92);z-index:100;gap:16px;transition:opacity .35s;}
.screen.hidden{opacity:0;pointer-events:none;}
.stitle{font-size:38px;font-weight:900;letter-spacing:6px;color:#ff6622;text-shadow:0 0 18px #ff4400,0 0 40px #ff220055;animation:flicker 5s infinite;}
.ssub{font-size:11px;color:rgba(255,160,60,.8);letter-spacing:3px;text-transform:uppercase;}
.sbtn{margin-top:12px;padding:13px 44px;background:transparent;border:1px solid #ff6622;color:#ff6622;font-family:'Courier New',monospace;font-size:15px;letter-spacing:4px;cursor:pointer;text-transform:uppercase;box-shadow:0 0 10px rgba(255,80,0,.35);}
.sbtn:active{background:rgba(255,80,0,.15);}
.badge{font-size:56px;}
#spotFlash{position:fixed;inset:0;background:rgba(255,0,0,.32);opacity:0;pointer-events:none;z-index:89;transition:opacity .08s;}
#flash{position:fixed;inset:0;background:#200;opacity:0;pointer-events:none;z-index:90;transition:opacity .15s;}
#monsterBar{position:fixed;top:calc(68px + var(--sat));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;pointer-events:none;}
.mIcon{font-size:18px;filter:drop-shadow(0 0 4px red);}
/* 열쇠 소지 표시 — 없을 땐 어둡게 두어 "뭔가 있다"는 것만 알린다 */
#keyHud{position:fixed;top:calc(96px + var(--sat));left:50%;transform:translateX(-50%);z-index:10;
        pointer-events:none;font-size:19px;opacity:.22;filter:grayscale(1);transition:opacity .25s,filter .25s;}
#keyHud.on{opacity:1;filter:none;text-shadow:0 0 10px #fc4;}
#hint{position:fixed;bottom:26%;left:50%;transform:translateX(-50%);z-index:12;pointer-events:none;
      font-size:12px;letter-spacing:2px;color:#ffcc66;text-shadow:0 0 8px rgba(0,0,0,.9);
      background:rgba(0,0,0,.55);padding:6px 14px;border:1px solid rgba(255,180,60,.3);
      opacity:0;transition:opacity .25s;white-space:nowrap;}
#hint.on{opacity:1;}
/* 품질 프리셋 선택 (타이틀 화면 전용) */
.qbar{display:flex;gap:6px;margin-top:2px;}
.rec{font-size:10px;color:rgba(255,190,110,.6);letter-spacing:1px;}
.sbtn-sm{margin-top:6px;padding:7px 22px;font-size:11px;letter-spacing:2px;opacity:.75;}
.qbtn{padding:7px 13px;background:transparent;border:1px solid rgba(255,102,34,.4);
      color:rgba(255,140,70,.7);font-family:'Courier New',monospace;font-size:10px;
      letter-spacing:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.qbtn.on{border-color:#ff6622;color:#ff6622;background:rgba(255,80,0,.15);box-shadow:0 0 8px rgba(255,80,0,.35);}
.qnote{font-size:8px;letter-spacing:1px;color:rgba(255,160,60,.42);}
@keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:.5}95%{opacity:1}97%{opacity:.3}}
/* 가로모드 — 세로 높이가 짧을 때. 세로 기준으로 짜인 고정 크기들이 화면을 다 잡아먹는다.
   (iPhone 가로는 대략 390~430px 높이) */
@media (max-height:520px){
  #touchL{top:calc(178px + var(--sat));}          /* 가로에서는 성능 패널이 y=170에서 끝난다 */
  #hud{padding:calc(6px + var(--sat)) calc(16px + var(--sar)) 6px calc(16px + var(--sal));}
  .hud-value{font-size:15px;}
  .hud-label{font-size:8px;letter-spacing:2px;}
  #monsterBar{top:calc(44px + var(--sat));}
  #keyHud{top:calc(68px + var(--sat));font-size:16px;}
  #hint{bottom:30%;font-size:11px;}
  #mmCanvas{bottom:calc(132px + var(--sab));width:84px;height:84px;}
  #perf{top:calc(52px + var(--sat));font-size:10px;line-height:1.45;padding:5px 8px;min-width:132px;}
  #perf .lb{width:42px;}
  #perf .hint{display:none;}
  #perfToggle{top:calc(52px + var(--sat));width:136px;height:118px;}
  .stitle{font-size:26px;letter-spacing:4px;}
  .screen{gap:8px;}
  .sbtn{margin-top:6px;padding:9px 34px;font-size:13px;}
  .badge{font-size:34px;}
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="vig"></div>
<div id="danger"></div>
<div id="hud">
  <div class="hud-block"><div class="hud-label">Level</div><div class="hud-value" id="hudLv">1</div></div>
  <div class="hud-block"><div class="hud-label">Escaped</div><div class="hud-value" id="hudEsc">0</div></div>
  <div class="hud-block"><div class="hud-label">Steps</div><div class="hud-value" id="hudSt">0</div></div>
</div>
<div id="monsterBar"></div>
<div id="keyHud">🔑</div>
<div id="hint"></div>
<div id="perf">
  <div><span class="lb">FPS</span><span class="pv" id="pFps">--</span> <span id="pMs" style="opacity:.55"></span></div>
  <div><span class="lb">최저</span><span class="pv" id="pMin">--</span> <span style="opacity:.45;font-size:10px">worst</span></div>
  <div><span class="lb">평균</span><span class="pv" id="pAvg">--</span></div>
  <div class="sep"></div>
  <div><span class="lb">DRAW</span><span class="pv" id="pCalls">--</span></div>
  <div><span class="lb">LIGHT</span><span class="pv" id="pLights">--</span></div>
  <div><span class="lb">TRIS</span><span class="pv" id="pTris">--</span></div>
  <div><span class="lb">OBJ</span><span class="pv" id="pObjs">--</span></div>
  <div class="sep"></div>
  <div><span class="lb">품질</span><span class="pv" id="pQual">--</span> <span class="pv" id="pScale" style="opacity:.6"></span></div>
  <div class="sep"></div>
  <div class="hint">1회 탭=기록초기화 · 3회=숨김</div>
</div>
<div id="perfToggle"></div>
<canvas id="mmCanvas" width="110" height="110"></canvas>
<div id="touchL"></div>
<div id="touchR"></div>
<div id="stick"><div id="stickKnob"></div></div>
<div id="spotFlash"></div>
<div id="flash"></div>
<div class="screen" id="titleScreen">
  <div class="stitle">DUNGEON ESCAPE</div>
  <div class="ssub">괴물을 피해 탈출하라</div>
  <div class="ssub" style="font-size:9px;opacity:.5;margin-top:4px">왼쪽 끌기 = 이동 (살살 밀면 소리가 안 남) · 오른쪽 문지르기 = 시선 · WASD</div>
  <div class="ssub rec" id="titleRec"></div>
  <button class="sbtn" id="startBtn">START</button>
  <button class="sbtn sbtn-sm" id="restartBtn">처음부터</button>
  <div class="ssub" style="font-size:9px;opacity:.55;margin-top:6px">QUALITY</div>
  <div class="qbar" data-qbar></div>
  <div class="qnote" id="qnote"></div>
</div>
<div class="screen hidden" id="winScreen">
  <div class="badge">🏃</div>
  <div class="stitle" style="font-size:26px">ESCAPED!</div>
  <div class="ssub" id="winSub"></div>
  <div class="ssub rec" id="winRec"></div>
  <button class="sbtn" id="nextBtn">NEXT LEVEL</button>
  <div class="ssub" style="font-size:9px;opacity:.5;margin-top:4px">QUALITY</div>
  <div class="qbar" data-qbar></div>
</div>
<div class="screen hidden" id="deadScreen">
  <div class="badge">💀</div>
  <div class="stitle" style="font-size:26px;color:#ff2200">YOU DIED</div>
  <div class="ssub" id="deadSub"></div>
  <div class="ssub rec" id="deadRec"></div>
  <button class="sbtn" id="retryBtn" style="border-color:#ff2200;color:#ff2200">RETRY</button>
  <div class="ssub" style="font-size:9px;opacity:.5;margin-top:4px">QUALITY</div>
  <div class="qbar" data-qbar></div>
</div>
<script>
// 전역 에러 핸들러 — CDN 모듈 내부 예외도 최대한 상세히 콘솔에 노출
window.addEventListener('error', function(e){
  console.error('[GAME ERROR]', e.message, 'at', e.filename+':'+e.lineno+':'+e.colno, e.error);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('[GAME PROMISE ERROR]', e.reason);
});
</script>
<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';
import { CELL,WALL_H,MAZE_MIN,MAZE_MAX,MAZE_STEP,mazeSizeFor,
         PLAYER_R,PLAYER_SPD,TURN_SPD,ACCEL,FRIC,
         FLOOR_MON_COUNT,FLOOR_CRAWLER_COUNT,MON_BASE_SPD,MON_SPD_INC,MON_SIGHT_R,MON_HEAR_R,MON_KILL_R,KEY_PICK_R,
         CHARGE_TIME,CHARGE_BOOST,SNARL_MIN,SNARL_VAR } from './js/constants.js';
import { QUALITY_PRESETS,QKEY,QNAME,Q,isMobile,detectQuality } from './js/quality.js';
import { generateMaze,bfsDistances,bfsNext,hasLOS } from './js/maze.js';
import { makeWallpaper,makeCarpet,makeDropCeiling,makeArrowDecal } from './js/textures.js';
import { unlockAudio,updateAudioListener,footstep,monsterStep,playGrowl,panelBuzz,
         playShriek,heartbeat,playDeath,playEscape,playKeyPickup,playLocked } from './js/audio.js';
import { progress,loadProgress,markLevel,markEscape,resetRun } from './js/save.js';

// MW/MH는 레벨마다 재할당되므로 main이 소유한다 (ES 모듈은 import한 바인딩에 대입할 수 없다)
let MW=MAZE_MIN,MH=MAZE_MIN;
let renderScale=Q.scale;   // 적응형이 조절하는 유일한 런타임 값

// ── THREE SETUP ──
const cv=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:Q.aa});
// setPixelRatio는 내부에서 setSize(w,h,false)를 호출하므로 별도 리사이즈가 필요 없다.
function applyRenderScale(){
  renderer.setPixelRatio(Math.min(devicePixelRatio,Q.prCap)*renderScale);
}
applyRenderScale();
renderer.setSize(innerWidth,innerHeight);
const MAX_ANISO=renderer.capabilities.getMaxAnisotropy();
renderer.shadowMap.enabled=false;
const scene=new THREE.Scene();
// 안개 색은 "노란 안개"가 아니라 어두운 올리브다. 밝은 색으로 두면 천장등이 없는
// 어두운 구역에서 원경이 오히려 환해져 어둠이 성립하지 않는다.
// 백룸의 노란 인상은 근경의 벽지가 만들고, 원경은 참고 사진들처럼 어둠에 잠겨야 한다.
const FOG_COLOR=0x272415;
scene.background=new THREE.Color(FOG_COLOR);
// 밀도는 던전 때 값을 그대로 둔다 — 가시거리 약 8~9칸이 MON_SIGHT_R=8과 맞물려
// 난이도를 잡고 있다. 겉모습만 바꾸고 밸런스는 건드리지 않는다.
scene.fog=new THREE.FogExp2(FOG_COLOR,0.058);
const camera=new THREE.PerspectiveCamera(80,innerWidth/innerHeight,0.05,60);
scene.add(camera);
// AmbientLight는 픽셀당 광원 순회 비용이 없다 — 백룸은 밝기의 대부분을 여기서 가져온다.
// 이 값이 "천장등이 없는 구역의 밝기"를 정한다. 칠흑이 아니라 어두운 황토색이어야 한다.
scene.add(new THREE.AmbientLight(0x4a4740,Q.ambient));

// 손전등 — 정전 때만 켜지는 SpotLight. 광원 "개수"가 늘어나는 유일한 예외이므로
// 항상 씬에 존재시키고 평소엔 intensity=0으로만 끈다(최우선 규칙 1·2번).
// target을 camera의 자식으로 두면 카메라가 매 프레임 이동·회전할 때 광원과 조준점이
// 자동으로 따라온다 — P.yaw/P.pitch를 따로 읽어 방향을 계산할 필요가 없다.
const FLASH_DISTANCE=9, FLASH_ANGLE=0.22, FLASH_PENUMBRA=0.5, FLASH_INTENSITY=3.0;
const flashlight=new THREE.SpotLight(0xfff4d6,0,FLASH_DISTANCE,FLASH_ANGLE,FLASH_PENUMBRA,2);
// ⚠ SpotLight/DirectionalLight는 기본 position이 (0,0,0)이 아니라 (0,1,0)이다
// ("위에서 아래로 비추는 조명"이 기본 가정이라서다). 그대로 두면 카메라보다 1m 위에서
// 눈높이의 조준점을 향해 쏘게 되어, 시선이 정면이어도 빔이 아래로 45° 꺾여 바닥을 비춘다.
// 카메라와 같은 자리에 둬야 시선 방향과 빔 방향이 일치한다.
flashlight.position.set(0,0,0);
const flashTarget=new THREE.Object3D();
flashTarget.position.set(0,0,-1);
camera.add(flashTarget);
flashlight.target=flashTarget;
camera.add(flashlight);

const ANISO=Q.aniso===0?MAX_ANISO:Math.min(Q.aniso,MAX_ANISO);
const wallMap =makeWallpaper(Q.texSize,ANISO);
const floorMap=makeCarpet(Q.texSize,ANISO);
const ceilMap =makeDropCeiling(Q.texSize,ANISO);
const arrowMap =makeArrowDecal(Q.texSize,ANISO);
// 2층 전용 텍스처 — 더 우중충한 황토~주황색 + 핏자국 강화. 1층 텍스처는 그대로 둔다.
const wallMap2 =makeWallpaper(Q.texSize,ANISO,{baseColor:'#9c6a35',bloodMul:4,grimeMul:1.3,
  bloodColor:'rgba(78,16,12,0.48)',dripColor:'rgba(78,16,12,0.40)'});
const floorMap2=makeCarpet(Q.texSize,ANISO,{baseR:90,baseG:58,baseB:28,blood:4});
const ceilMap2 =makeDropCeiling(Q.texSize,ANISO,{baseR:188,baseG:164,baseB:122,
  stainChance:.35,stainColor:'rgba(140,90,40,0.48)'});

// 재질 팩토리 — LOW/MEDIUM은 MeshPhongMaterial로 대체한다.
// MeshLambertMaterial을 쓰지 않는 이유: r128의 Lambert는 정점 단위(Gouraud) 조명이라
// 세그먼트 1개짜리 BoxGeometry 벽(정점 8개)에서는 횃불 PointLight의 감쇠가 정점에서만
// 계산되어 빛이 사각 얼룩으로 뭉개진다. 이 게임은 횃불 조명이 분위기의 핵심이라 치명적.
// Phong은 픽셀 단위 조명을 유지하면서 Standard의 PBR 연산(BRDF)만 걷어낸다.
function mkMat(o){
  if(Q.matType!=='phong') return new THREE.MeshStandardMaterial(o);
  const p={};
  for(const k of ['map','color','emissive','emissiveIntensity','transparent','opacity','side'])
    if(o[k]!==undefined)p[k]=o[k];
  p.shininess=o.roughness!==undefined?Math.max(2,(1-o.roughness)*60):30;
  p.specular=new THREE.Color((o.metalness||0)>0.4?0x555555:0x111111);
  return new THREE.MeshPhongMaterial(p);
}

// 백룸 팔레트 — 색은 텍스처가 들고 있고 재질은 tint하지 않는다(0xffffff).
// emissive를 주지 않는 이유: 밝아진 ambient와 겹치면 흰색으로 날아가 벽지 무늬가 사라진다.
const mWall  =mkMat({map:wallMap, color:0xffffff,roughness:.92,metalness:.02});
const mFloor =mkMat({map:floorMap,color:0xffffff,roughness:.98,metalness:.0});

// 이빨 12개를 한 덩어리로 합친다 — 마리마다 원뿔 12개를 따로 다는 것보다 객체가 12배 적다.
// mergeParts는 position/normal/uv를 가진 인덱스 지오메트리면 받으므로 ConeGeometry도 된다.
// ⚠ mergeParts/part가 쓰는 _mgMat 등이 이 아래에서 const로 선언되므로 모듈 평가 시점에
//   호출하면 TDZ에 걸린다. 첫 몬스터 생성 때 한 번만 만들어 캐시한다.
let _gToothU=null,_gToothL=null;
function toothRows(){
  if(!_gToothU){
    const cone=new THREE.ConeGeometry(.019,.070,5);
    const row=upper=>{
      const parts=[];
      for(let i=0;i<12;i++){
        const th=Math.PI*(0.12+0.76*(i/11));    // 앞쪽 반원에만 늘어세운다
        part(parts,cone,Math.cos(th)*.105,upper?-.030:.030,Math.sin(th)*.105, upper?Math.PI:0);
      }
      return mergeParts(parts);
    };
    _gToothU=row(true); _gToothL=row(false);
  }
  return [_gToothU,_gToothL];
}

// 회전축 Group을 만들고 그 안에 메시를 길이의 절반만큼 내려 단다.
// 이렇게 해야 Group을 돌렸을 때 관절을 중심으로 회전한다(메시 중앙이 아니라).
function jointLimb(geo,len,parent,x,y,z){
  const pivot=new THREE.Group();
  pivot.position.set(x,y,z||0);
  const mesh=new THREE.Mesh(geo,mMonBody);
  mesh.position.y=-len/2;
  pivot.add(mesh);
  parent.add(pivot);
  return pivot;
}

// ── 좌측: 플로팅 아날로그 스틱 (이동) ──
// jFwd는 전진이 -1, dSide는 우횡이동이 +1 (게임 루프의 기존 규약 그대로).
// 소수값을 그대로 넣으면 이동 계산식이 알아서 비례 속도를 만든다 — 살살 밀면
// 속도가 몬스터 청각 문턱(1.5) 아래로 내려가 잠입이 된다.
let jFwd=0, dSide=0;
const STICK_R=52, STICK_DEAD=6;
const stickEl=document.getElementById('stick'), knobEl=document.getElementById('stickKnob');
const touchL=document.getElementById('touchL');
let sId=-1, sBaseX=0, sBaseY=0;

function stickStart(t){
  sId=t.identifier; sBaseX=t.clientX; sBaseY=t.clientY;
  stickEl.style.left=sBaseX+'px'; stickEl.style.top=sBaseY+'px';
  knobEl.style.transform='translate(0px,0px)';
  stickEl.classList.add('on');
}
function stickMove(t){
  let dx=t.clientX-sBaseX, dy=t.clientY-sBaseY;
  const d=Math.hypot(dx,dy);
  // 원형 클램프 — 이게 없으면 대각선이 √2배 빨라진다 (십자키 시절의 버그)
  if(d>STICK_R){dx=dx/d*STICK_R; dy=dy/d*STICK_R;}
  knobEl.style.transform=`translate(${dx}px,${dy}px)`;
  const m=Math.hypot(dx,dy);
  if(m<STICK_DEAD){jFwd=0;dSide=0;return;}
  // 데드존 바깥을 0~1로 다시 펴서 문턱을 넘는 순간 튀지 않게 한다
  const k=(m-STICK_DEAD)/((STICK_R-STICK_DEAD)*m);
  jFwd=dy*k; dSide=dx*k;
}
function stickEnd(){sId=-1;jFwd=0;dSide=0;stickEl.classList.remove('on');}

touchL.addEventListener('touchstart',e=>{e.preventDefault();
  if(sId===-1) stickStart(e.changedTouches[0]);},{passive:false});
touchL.addEventListener('touchmove',e=>{e.preventDefault();
  for(const t of e.changedTouches) if(t.identifier===sId) stickMove(t);},{passive:false});
// touchcancel까지 반드시 잡아야 한다 — 놓치면 손을 뗐는데 계속 걸어간다
for(const ev of ['touchend','touchcancel'])
  touchL.addEventListener(ev,e=>{
    for(const t of e.changedTouches) if(t.identifier===sId) stickEnd();},{passive:false});

// 레벨 전체의 활성 천장등이 한꺼번에 꺼지는 이벤트. 무작위 타이밍, 최소 대기(쿨다운) 있음.
// blackoutT: -1이면 평상시. 0 이상이면 정전 시작 후 경과 시간(초) — 이 하나만으로
// "빛도 손전등도 없는 첫 구간"과 "손전등만 있는 구간"을 동시에 표현한다.
// 전부 초기 제안값입니다 — 실기기에서 체감하며 조정할 값입니다.
const BLACKOUT_DURATION=12, FLASH_DELAY=1.0;      // 정전 총 길이 / 손전등이 켜지기까지의 지연
const BLACKOUT_COOLDOWN_MIN=25, BLACKOUT_COOLDOWN_VAR=20, BLACKOUT_CHANCE_PER_SEC=1/45;
let blackoutT=-1, _blackoutCooldown=BLACKOUT_COOLDOWN_MIN+Math.random()*BLACKOUT_COOLDOWN_VAR;

// 어두운 구역 — 천장등이 죽은 구획. 칸 단위로 무작위하면 얼룩덜룩해질 뿐이라
// DARK_BLOCK칸짜리 덩어리로 묶어 "복도 하나가 통째로 어둡다"가 되게 한다.
// level을 섞어 레벨마다 배치가 달라지되, 같은 레벨 안에서는 결정적이다.
const DARK_BLOCK=5, DARK_PCT=28;
function isDarkZone(col,row){
  const bx=(col/DARK_BLOCK)|0, bz=(row/DARK_BLOCK)|0;
  let h=(bx*73856093)^(bz*19349663)^(level*83492791);
  h=(h^(h>>>13))>>>0;
  return h%100<DARK_PCT;
}
let cachedPortal=null,cachedExitLight=null,cachedExitRing=null;
// ── 열쇠와 잠긴 문 ──
// 문은 출구 자체다. 미로 중간에 두면 열쇠가 문 뒤에 갇히지 않는지 매번 검사해야 하는데,
// 출구를 잠그면 그 문제가 사라지고(문 앞은 언제나 전부 도달 가능) 규칙도 명확해진다.
let hasKey=false, keyPos={x:1,z:1};
let keyMesh=null, doorGroup=null, lockGroup=null;
// 스프레이 화살표 — 레벨당 무작위 길 칸 1곳. 정확한 길찾기 힌트가 아니라 분위기용 장치다
// (자세한 이유는 startLevel의 배치 코드 주석 참고). 미니맵이 여전히 유일한 진짜 단서다.
let arrowPos={x:1,z:1}, arrowGroup=null;
function isWall(gx,gz){if(gx<0||gz<0||gx>=MW||gz>=MH)return true;return mazeGrid[gz][gx]===0;}
function addO(o){scene.add(o);worldObjs.push(o);return o;}

// 광원 풀 생성 (씬에 상주, 레벨이 바뀌어도 재사용)
function initPanelLightPool(){
  for(const l of panelLightPool){scene.remove(l);}
  panelLightPool.length=0;
  for(let i=0;i<MAX_PANEL_LIGHTS;i++){
    // 형광등 색. 횃불의 주황(0xff9933)을 그대로 두면 벽지의 노랑과 곱해져
    // 형광 주황으로 타 버린다. 사무실 형광등 특유의 차갑고 살짝 초록빛 도는 흰색이어야
    // 벽지가 "겨자색"으로 남는다.
    const l=new THREE.PointLight(0xeef2e2,0,PANEL_RANGE);
    l.position.set(0,-999,0);   // 처음엔 씬 밖
    scene.add(l);
    panelLightPool.push(l);
  }
}

// 매 프레임 호출: 플레이어에게 가장 가까운 횃불에 광원 풀을 배치
let _panelUpdT=0;
function updatePanelLights(dt,t){
  _panelUpdT-=dt;
  if(_panelUpdT>0) return;      // 프리셋별 주기마다만 재배치 (충분히 부드러움)
  _panelUpdT=Q.panelInterval;

  // 유효 반경 안에 있는 횃불만 후보로 추림
  const cands=[];
  const R2=(PANEL_RANGE+CELL)*(PANEL_RANGE+CELL);
  for(let i=0;i<panelData.length;i++){
    const td=panelData[i];
    const dx=td.x-P.x, dz=td.z-P.z;
    const d2=dx*dx+dz*dz;
    if(d2<R2) cands.push({d2,td});
  }
  cands.sort((a,b)=>a.d2-b.d2);

  for(let i=0;i<panelLightPool.length;i++){
    const l=panelLightPool[i];
    if(i<cands.length){
      const td=cands[i].td;
      l.position.set(td.x,td.y,td.z);
      l.userData.td=td;
      l.userData.on=true;
    }else{
      // 남는 광원은 끄되 visible은 건드리지 않음
      // (Three.js는 보이는 광원 "개수"가 바뀌면 셰이더를 재컴파일하므로 개수는 항상 고정 유지)
      l.position.set(0,-9999,0);
      l.intensity=0;
      l.userData.on=false;
    }
  }
}

// ── 지오메트리 병합 ──
// 칸마다 Mesh를 하나씩 만들면 41×41에서 씬 객체가 3,000개를 넘는다. DRAW·TRIS는 컬링 덕에
// 그대로인데도 FPS가 59 → 40으로 떨어졌다. 매 프레임 모든 객체의 행렬 갱신과 절두체 컬링을
// 도는 CPU 비용이 원인이다. 정적인 벽·바닥·천장을 재질별로 하나의 지오메트리에 합쳐 없앤다.
//
// r128의 BufferGeometryUtils는 examples/ 쪽에 있어 코어 모듈에 없다. CDN 의존을 하나 더
// 늘리지 않으려고 직접 합친다. position/normal/uv 를 가진 인덱스 지오메트리면 종류가 달라도 된다.
const _mgV=new THREE.Vector3(),_mgN=new THREE.Vector3(),_mgNM=new THREE.Matrix3();
function mergeParts(parts){
  let vTot=0,iTot=0;
  for(const p of parts){vTot+=p.geo.attributes.position.count;iTot+=p.geo.index.count;}
  const P=new Float32Array(vTot*3),N=new Float32Array(vTot*3),U=new Float32Array(vTot*2);
  const I=vTot>65535?new Uint32Array(iTot):new Uint16Array(iTot);
  let vo=0,io=0;
  for(const p of parts){
    const pos=p.geo.attributes.position,nor=p.geo.attributes.normal,uv=p.geo.attributes.uv,idx=p.geo.index;
    _mgNM.getNormalMatrix(p.m);
    for(let i=0;i<pos.count;i++){
      _mgV.fromBufferAttribute(pos,i).applyMatrix4(p.m);
      P[(vo+i)*3]=_mgV.x;P[(vo+i)*3+1]=_mgV.y;P[(vo+i)*3+2]=_mgV.z;
      _mgN.fromBufferAttribute(nor,i).applyMatrix3(_mgNM).normalize();
      N[(vo+i)*3]=_mgN.x;N[(vo+i)*3+1]=_mgN.y;N[(vo+i)*3+2]=_mgN.z;
      U[(vo+i)*2]=uv.getX(i);U[(vo+i)*2+1]=uv.getY(i);
    }
    for(let i=0;i<idx.count;i++) I[io+i]=idx.getX(i)+vo;
    vo+=pos.count;io+=idx.count;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(P,3));
  g.setAttribute('normal',new THREE.BufferAttribute(N,3));
  g.setAttribute('uv',new THREE.BufferAttribute(U,2));
  g.setIndex(new THREE.BufferAttribute(I,1));
  g.computeBoundingSphere();
  return g;
}

// 병합 대상은 Mesh를 만들지 않고 {geo, 행렬} 목록으로만 모은다
const _mgMat=new THREE.Matrix4(),_mgQ=new THREE.Quaternion(),_mgS=new THREE.Vector3(1,1,1),_mgE=new THREE.Euler();
function part(list,geo,x,y,z,rx,rz){
  _mgE.set(rx||0,0,rz||0);
  _mgQ.setFromEuler(_mgE);
  _mgMat.compose(_mgV.set(x,y,z),_mgQ,_mgS);
  list.push({geo,m:_mgMat.clone()});
}

// 형광판은 천장에 붙은 납작한 면 하나다. 횃불과 달리 매 프레임 흔들리는 부분이 없어
// 전부 병합할 수 있다 — 병합 불가 객체(torchFlames)가 통째로 사라졌다.
// PlaneGeometry의 법선은 +Z이므로 X축으로 +90° 돌려 아래(-Y)를 보게 한다.
const gPanel=new THREE.PlaneGeometry(.78,1.5);

function placePanel(wx,wz,glow){
  part(glow,gPanel,wx,WALL_H-.012,wz,Math.PI/2);
  // 실제 PointLight를 만들지 않고 위치 데이터만 등록 (풀링 구조는 횃불 때와 동일)
  panelData.push({x:wx, y:WALL_H-.14, z:wz, phase:Math.random()*Math.PI*2});
}

function buildWorld(){
  worldObjs.forEach(o=>scene.remove(o));worldObjs.length=0;panelData.length=0;
  const gW=new THREE.BoxGeometry(CELL,WALL_H,CELL);
  const gF=new THREE.BoxGeometry(CELL,.1,CELL);
  // 전부를 한 덩어리로 합치면 절두체 컬링이 통째로 무력화되어 미로 전체가 매 프레임
  // 그려진다(실측: TRIS 0.1k → 17.9k). CHUNK칸 단위로 나눠 합쳐야 객체 수도 줄고
  // 컬링도 그대로 살아난다.
  const CHUNK=6, cxN=Math.ceil(MW/CHUNK), czN=Math.ceil(MH/CHUNK);
  const mk=()=>Array.from({length:cxN*czN},()=>[]);
  const walls=mk(),floors=mk(),ceils=mk(),ceilsDark=mk(),glow=mk();
  for(let row=0;row<MH;row++)for(let col=0;col<MW;col++){
    const wx=col*CELL,wz=row*CELL;
    const ci=((row/CHUNK)|0)*cxN+((col/CHUNK)|0);
    if(mazeGrid[row][col]===0){
      part(walls[ci],gW,wx,WALL_H/2,wz);
    }else{
      part(floors[ci],gF,wx,-.05,wz);
      // 천장등은 길 칸 위에 격자로. 체커보드라 어느 방향 복도든 두 칸마다 하나가 걸린다.
      // 어두운 구역에는 놓지 않는다 — 이게 "군데군데 어두운 통로"의 정체다.
      const dark=isDarkZone(col,row);
      part((dark?ceilsDark:ceils)[ci],gF,wx,WALL_H+.05,wz);
      if(!dark && (col+row)%2===0) placePanel(wx,wz,glow[ci]);
    }
  }
  // 2층은 텍스처만 다른 재질 세트를 쓴다(더 우중충한 황토~주황색 + 핏자국 강화).
  // 광원·조명 파라미터는 손대지 않았으므로 밝기 기준·성능 특성은 1층과 동일하다.
  const wallMat=floor===2?mWall2:mWall, floorMat=floor===2?mFloor2:mFloor;
  const ceilMat=floor===2?mCeil2:mCeil, ceilDarkMat=floor===2?mCeilDark2:mCeilDark;
  for(const[lists,mat] of [[walls,wallMat],[floors,floorMat],[ceils,ceilMat],[ceilsDark,ceilDarkMat],[glow,mPanel]])
    for(const list of lists)
      if(list.length) addO(new THREE.Mesh(mergeParts(list),mat));
  // ── 출구 ── 열린 포탈과 잠긴 문을 함께 만들고 열쇠 소지 여부로 전환한다
  const ex=exitPos.x*CELL, ez=exitPos.z*CELL;
  const ep=addO(new THREE.Mesh(new THREE.BoxGeometry(1.1,1.9,.12),mExit));
  ep.position.set(ex,WALL_H/2-.3,ez);ep.userData.isPortal=true;
  cachedPortal=ep;
  const el=new THREE.PointLight(0x00ff88,5,CELL*1.5,2);
  el.position.set(ex,1.2,ez);el.userData.isExitLight=true;addO(el);
  cachedExitLight=el;
  const ring=addO(new THREE.Mesh(new THREE.RingGeometry(.6,.76,24),
    mkMat({color:0x00ff88,emissive:0x00ff88,emissiveIntensity:2,side:THREE.DoubleSide})));
  ring.rotation.x=-Math.PI/2;ring.position.set(ex,.015,ez);
  cachedExitRing=ring;

  // 1층 목표 지점 — 뚫린 쪽을 향하도록 세운다 (돌아가지 않는다. 문이 빙빙 돌면 우습다)
  // ⚠ 변수명은 doorGroup 그대로 둔다(applyKeyState() 등 참조가 많아 코드 변경을 최소화) —
  //   지금은 문이 아니라 2층으로 올라가는 사다리다. 사다리 자체는 1층에서 항상 보이고,
  //   가로대 사이의 자물쇠(lockGroup)만 열쇠를 얻으면(hasKey) 따로 사라진다 — 사다리를
  //   오를 수 있게 됐다는 뜻이지 사다리가 없어지는 게 아니므로 둘을 분리했다.
  doorGroup=new THREE.Group();
  const railL=new THREE.Mesh(gLadderRail,mDoor); railL.position.set(-LADDER_W/2,LADDER_H/2,.03); doorGroup.add(railL);
  const railR=new THREE.Mesh(gLadderRail,mDoor); railR.position.set( LADDER_W/2,LADDER_H/2,.03); doorGroup.add(railR);
  for(let i=0;i<LADDER_RUNGS;i++){
    const rung=new THREE.Mesh(gLadderRung,mDoor);
    rung.rotation.z=Math.PI/2;
    rung.position.set(0,.25+i*(LADDER_H-.5)/(LADDER_RUNGS-1),.05);
    doorGroup.add(rung);
  }
  lockGroup=new THREE.Group();
  const lockBody=new THREE.Mesh(gLockBody,mLock); lockBody.position.set(0,1.02,.10); lockGroup.add(lockBody);
  const shackle=new THREE.Mesh(gLockShkl,mLock); shackle.position.set(0,1.13,.10); lockGroup.add(shackle);
  doorGroup.add(lockGroup);
  doorGroup.position.set(ex,0,ez);
  for(const[dx,dz]of[[0,-1],[1,0],[0,1],[-1,0]]){
    if(!isWall(exitPos.x+dx,exitPos.z+dz)){doorGroup.rotation.y=Math.atan2(dx,dz);break;}
  }
  addO(doorGroup);

  // ── 열쇠 ── 시작 지점에서 충분히 떨어진 길 칸에 둔다
  keyMesh=new THREE.Group();
  const kr=new THREE.Mesh(gKeyRing,mKey);   kr.position.y=.10; keyMesh.add(kr);
  const ks=new THREE.Mesh(gKeyShaft,mKey);  ks.position.y=-.07; keyMesh.add(ks);
  const kt1=new THREE.Mesh(gKeyTooth,mKey); kt1.position.set(.036,-.145,0); keyMesh.add(kt1);
  const kt2=new THREE.Mesh(gKeyTooth,mKey); kt2.position.set(.036,-.075,0); keyMesh.add(kt2);
  keyMesh.position.set(keyPos.x*CELL,1.0,keyPos.z*CELL);
  addO(keyMesh);

  // ── 스프레이 화살표 ── 바닥에 눕혀 두고 그룹 회전만으로 방향을 준다.
  // gArrowDecal의 기본 법선은 +Z. rotation.x=-PI/2로 눕히면 로컬 +Z가 +Y(위)를 향하고,
  // 이때 캔버스 위쪽(로컬 +Y, 화살표가 그려진 방향)은 세계 -Z를 향하게 된다.
  // 그 상태에서 바깥 그룹을 rotation.y=atan2(-dx,-dz)만큼 돌리면, 플레이어 yaw와
  // 정확히 같은 공식으로 (dx,dz) 방향 — 즉 출구 쪽 — 을 가리키게 된다.
  arrowGroup=new THREE.Group();
  const arrowPlane=new THREE.Mesh(gArrowDecal,mArrow);
  arrowPlane.rotation.x=-Math.PI/2;
  arrowGroup.add(arrowPlane);
  const adx=exitPos.x-arrowPos.x, adz=exitPos.z-arrowPos.z;
  arrowGroup.rotation.y=Math.atan2(-adx,-adz);
  arrowGroup.position.set(arrowPos.x*CELL,.018,arrowPos.z*CELL);
  addO(arrowGroup);

  applyKeyState();

  initPanelLightPool();   // 횃불 광원 풀 생성 (개수 고정)
}

// 열쇠 소지 여부를 화면에 반영. 광원 "개수"는 건드리지 않고 세기·색만 바꾼다.
function applyKeyState(){
  // 사다리(doorGroup)는 1층에서 잠금 여부와 무관하게 계속 보인다 — 잠금 표시는
  // lockGroup 하나만 열쇠 여부로 토글한다. 포탈은 2층 전용(그쪽은 hasKey가 항상 true).
  if(doorGroup) doorGroup.visible=floor===1;
  if(lockGroup) lockGroup.visible=!hasKey;
  if(cachedPortal) cachedPortal.visible=floor===2;
  if(keyMesh) keyMesh.visible=!hasKey;
  // 바닥 링은 계속 보이되 색으로 상태를 알린다 — 잠김 호박색 / 열림 초록
  if(cachedExitRing){
    const c=hasKey?0x00ff88:0xffaa33;
    cachedExitRing.material.color.setHex(c);
    cachedExitRing.material.emissive.setHex(c);
  }
  const k=document.getElementById('keyHud');
  if(k) k.classList.toggle('on',hasKey);
}

// ── COLLISION ──
function blocked(nx,nz){
  for(const[ox,oz]of[[-PLAYER_R,-PLAYER_R],[PLAYER_R,-PLAYER_R],[-PLAYER_R,PLAYER_R],[PLAYER_R,PLAYER_R]])
    if(isWall(Math.round((nx+ox)/CELL),Math.round((nz+oz)/CELL)))return true;
  return false;
}

// ── MONSTER CLASS ──
// 타입별 감각·속도 설정. 지오메트리/재질은 여기 넣지 않는다 — 그건 생성자의 메시
// 분기가 직접 참조한다. standard는 기존 전역 상수와 값이 같아서, 도입 전후로
// 동작이 완전히 동일하다(크롤러 도입 자체는 아직 스폰되지 않으므로 무효과).
const MONSTER_TYPES = {
  standard: { sightR: MON_SIGHT_R, hearR: MON_HEAR_R, hearMinSpd: 1.5, spdMul: 1.0  },
  crawler:  { sightR: 5,           hearR: 6.5,         hearMinSpd: 0,   spdMul: 1.28 },
};

class Monster{
  constructor(gx,gz,spd,type='standard'){
    this.type=type;
    this.cfg=MONSTER_TYPES[type];
    this._px=gx*CELL; this._pz=gz*CELL;   // 거리 기반 위상용 직전 좌표
    this.gx=gx;this.gz=gz;this.wx=gx*CELL;this.wz=gz*CELL;this.spd=spd;
    this.state='patrol';this.path=null;this.patrolTarget=null;
    this.searchPos=null;this.searchTimer=0;this.alertTimer=0;
    this.chargeT=0;this.snarlT=0;

    // mesh — 관절 구조. 팔은 어깨·팔꿈치 2단이라 휘저을 때 꺾인다.
    this.group=new THREE.Group();
    this.anim=Math.random()*Math.PI*2;   // 개체마다 다른 위상으로 시작
    this.facing=0;

    if(this.type==='crawler'){
      // 낮은 네발 자세 — 세로 실린더를 눕혀 척추 방향(Z축)으로 삼는다.
      const torso=new THREE.Mesh(gCrawlTorso,mMonBody);
      torso.position.y=CRAWL_BODY_Y;
      torso.rotation.x=Math.PI/2;
      this.group.add(torso);
    }else{
      const torso=new THREE.Mesh(gMonTorso,mMonBody);
      torso.position.y=(MON_HIP_Y+MON_SHO_Y)/2;
      torso.rotation.x=0.16;               // 앞으로 굽은 자세
      this.group.add(torso);
    }

    // 머리는 회전축(head) 안에 위턱·아래턱 두 Group을 형제로 넣는다.
    // 두개골 메시에 준 비균등 스케일이 이빨로 상속되면 이빨이 같이 일그러지기 때문에,
    // 이빨은 반구의 자식이 아니라 턱 Group의 자식이어야 한다.
    // 눈도 이목구비도 없다 — 참고 사진의 개체는 얼굴이 없는 검은 덩어리다.
    // (머리·입·이빨 자체는 두 타입이 완전히 공유한다 — 위치만 다르다)
    this.head=new THREE.Group();
    if(this.type==='crawler') this.head.position.set(0,CRAWL_HEAD_Y,CRAWL_HEAD_Z);
    else this.head.position.y=MON_HEAD_Y;
    this.group.add(this.head);

    const[gTU,gTL]=toothRows();
    const HINGE=-.10;                     // 경첩은 머리 뒤쪽. 앞이 쩍 벌어진다
    const mkJaw=(geo,scaleY,mawSign,teeth)=>{
      const g=new THREE.Group();
      g.position.z=HINGE;
      const sk=new THREE.Mesh(geo,mMonBody);
      sk.position.z=-HINGE; sk.scale.set(.88,scaleY,.88);
      g.add(sk);
      // 반구는 뚫려 있어 벌리면 속이 비쳐 보인다. 갈라진 면을 어두운 살로 막는다.
      // ⚠ 원판의 법선은 +Z이고, X축으로 θ 돌리면 (0,-sinθ,cosθ)를 향한다.
      //   위턱의 열린 면은 아래(-Y)를 보므로 +π/2, 아래턱은 위(+Y)를 보므로 -π/2다.
      //   부호를 반대로 뒀더니 두 원판이 모두 바깥을 향해 백페이스로 컬링됐고,
      //   머리 속이 뚫려 천장이 그대로 비쳤다.
      const maw=new THREE.Mesh(gMonMaw,mMonMaw);
      maw.position.set(0,mawSign*.005,-HINGE);
      maw.rotation.x=mawSign*Math.PI/2;
      g.add(maw);
      const t=new THREE.Mesh(teeth,mMonTooth);
      t.position.z=-HINGE; g.add(t);
      this.head.add(g);
      return g;
    };
    this.upperJaw=mkJaw(gMonSkullU,1.30, 1,gTU);   // 길쭉한 두개골
    this.jaw     =mkJaw(gMonSkullL,0.95,-1,gTL);   // 얕은 아래턱
    this.jawOpen=0;

    if(this.type==='crawler'){
      // 목 — 낮은 몸통 앞쪽에서 머리 쪽으로 비스듬히 이어준다 (표준과 같은 이유로 필요:
      // 아래턱이 벌어지면 머리 아래가 비어 천장이 비친다).
      const neck=new THREE.Mesh(gMonNeck,mMonBody);
      neck.position.set(0,(CRAWL_BODY_Y+CRAWL_HEAD_Y)/2,CRAWL_HEAD_Z*0.55);
      neck.rotation.x=-Math.PI/2.2;
      this.group.add(neck);

      // 다리 넷 — 전부 같은 구조(관절 2개: 위 마디는 위·바깥, 아래 마디는 무릎에서
      // 꺾여 바닥으로). sx=-1(왼쪽)/+1(오른쪽)이 splay 방향을 좌우로 뒤집는다.
      // 프로퍼티 이름(armL/legR 등)은 표준 몬스터와 맞춰 뒀다 — update()가 타입별로
      // 갈라지므로 이름 자체엔 의미가 없고, 걸음 코드에서 짝을 지어 쓸 때 참조한다.
      const mkSpiderLeg=(sx,z)=>{
        const upper=jointLimb(gCrawlLegU,CRAWL_LEG_UPPER,this.group,sx*CRAWL_ANCHOR_X,CRAWL_LEG_ANCHOR_Y,z);
        upper.rotation.z=sx*CRAWL_UPPER_SPLAY;
        const lower=jointLimb(gCrawlLegF,CRAWL_LEG_LOWER,upper,0,-CRAWL_LEG_UPPER);
        lower.rotation.z=sx*CRAWL_LOWER_LOCAL;
        return [upper,lower];
      };
      [this.armL,this.foreL]=mkSpiderLeg(-1,CRAWL_FRONT_Z);
      [this.armR,this.foreR]=mkSpiderLeg( 1,CRAWL_FRONT_Z);
      [this.legL,this.shinL]=mkSpiderLeg(-1,CRAWL_REAR_Z);
      [this.legR,this.shinR]=mkSpiderLeg( 1,CRAWL_REAR_Z);
    }else{
      // 목 — 아래턱이 벌어지면 머리 아래가 통째로 비어 천장이 그대로 비친다. 그 구멍을 막는다.
      // head가 아니라 group의 자식이라 고개를 돌려도 목은 몸통에 붙어 있다.
      const neck=new THREE.Mesh(gMonNeck,mMonBody);
      neck.position.y=MON_SHO_Y+.02;
      this.group.add(neck);

      // 팔 — 정강이 근처까지 내려오는 비정상적인 길이 (어깨 1.82에서 1.40을 내려 0.42)
      // 어깨 축은 몸통 윗반지름(MON_TORSO_RT)보다 바깥에 둔다. 안쪽에 두면 팔이 몸통 실루엣에
      // 파묻혀 몸통이 끝나는 허리 높이에서야 밖으로 나오고, 어깨가 아래에 붙은 것처럼 보인다.
      // ★ 왼팔만 MON_ARM_LONG_* 지오메트리로 — 좌우 비대칭이 "사람이 아니다"를 가장 직접적으로
      //   전달한다. 애니메이션(위 sw 기반 회전)은 좌우 동일하게 걸리므로 손대지 않는다 —
      //   같은 각도라도 팔이 길어 손끝이 훨씬 아래·바깥까지 쓸고 다니는 것만으로 충분하다.
      this.armL=jointLimb(gMonUpperL,MON_ARM_LONG_UP,this.group,-MON_SHO_ARM_X,MON_SHO_Y);
      this.armR=jointLimb(gMonUpper,.66,this.group, MON_SHO_ARM_X,MON_SHO_Y);
      this.foreL=jointLimb(gMonForeL,MON_ARM_LONG_FORE,this.armL,0,-MON_ARM_LONG_UP);
      this.foreR=jointLimb(gMonFore,.74,this.armR,0,-.66);
      this.legL=jointLimb(gMonLeg,MON_LEG_LEN,this.group,-.075,MON_HIP_Y);
      this.legR=jointLimb(gMonLeg,MON_LEG_LEN,this.group, .075,MON_HIP_Y);
    }
    this.group.position.set(this.wx,.1,this.wz);
    scene.add(this.group);worldObjs.push(this.group);
  }

  seesPlayer(){
    const pgx=Math.round(P.x/CELL),pgz=Math.round(P.z/CELL);
    const dx=pgx-this.gx,dz=pgz-this.gz;
    if(dx*dx+dz*dz>this.cfg.sightR*this.cfg.sightR)return false;
    return hasLOS(mazeGrid,MW,MH,this.gx,this.gz,pgx,pgz);
  }
  hearsPlayer(){
    if(P.spd<this.cfg.hearMinSpd)return false;
    const pgx=Math.round(P.x/CELL),pgz=Math.round(P.z/CELL);
    const dx=pgx-this.gx,dz=pgz-this.gz;
    return dx*dx+dz*dz<=this.cfg.hearR*this.cfg.hearR;
  }
  pickPatrol(){
    for(let i=0;i<30;i++){
      const rx=1+2*(0|Math.random()*((MW-1)/2));
      const rz=1+2*(0|Math.random()*((MH-1)/2));
      if(mazeGrid[rz]&&mazeGrid[rz][rx]===1&&(rx!==this.gx||rz!==this.gz)){this.patrolTarget=[rx,rz];return;}
    }
  }
  // 발각 순간 — 비명을 지르고 잠깐 달려든다
  onSpotted(){
    playShriek(this.wx,this.wz);
    flashSpot();
    this.chargeT=CHARGE_TIME;
    this.snarlT=0.9;          // 비명 직후 곧바로 으르렁이 겹치지 않게 한 박자 띄운다
  }
  update(dt,lv,t){
    const pgx=Math.round(P.x/CELL),pgz=Math.round(P.z/CELL);
    const sees=this.seesPlayer(),hears=this.hearsPlayer();

    if(this.state==='patrol'){
      if(sees||hears){
        this.state='chase';this.alertTimer=0;
        this.searchPos=[pgx,pgz]; // chase 진입 즉시 위치 기록 — searchPos null 방지
        this.onSpotted();
      }
      else{
        if(!this.patrolTarget||(this.gx===this.patrolTarget[0]&&this.gz===this.patrolTarget[1]))this.pickPatrol();
        this.alertTimer-=dt;
        if(this.alertTimer<=0&&this.patrolTarget){this.path=bfsNext(mazeGrid,MW,MH,this.gx,this.gz,this.patrolTarget[0],this.patrolTarget[1]);this.alertTimer=1.2;}
      }
    }else if(this.state==='chase'){
      this.searchPos=[pgx,pgz]; // chase 중엔 매 프레임 최신 위치 유지
      if(sees){
        this.alertTimer-=dt;
        if(this.alertTimer<=0){this.path=bfsNext(mazeGrid,MW,MH,this.gx,this.gz,pgx,pgz);this.alertTimer=0.45;}
      }else{
        this.state='search';this.searchTimer=8+Math.random()*4;
        this.path=bfsNext(mazeGrid,MW,MH,this.gx,this.gz,this.searchPos[0],this.searchPos[1]);
      }
    }else{// search
      this.searchTimer-=dt;
      if(sees||hears){this.state='chase';this.alertTimer=0;this.onSpotted();}
      else if(!this.searchPos||this.searchTimer<=0){
        // searchPos가 애초에 없거나(청각 감지 등) 타이머 만료 — 순찰로 복귀
        this.state='patrol';this.path=null;this.patrolTarget=null;this.searchPos=null;
      }
      else if(!this.path||(this.gx===this.searchPos[0]&&this.gz===this.searchPos[1])){
        for(let i=0;i<20;i++){
          const ox=Math.round(Math.random()*6-3),oz=Math.round(Math.random()*6-3);
          const nx=(this.searchPos[0]+ox),nz=(this.searchPos[1]+oz);
          if(nx>=0&&nz>=0&&nx<MW&&nz<MH&&mazeGrid[nz][nx]===1){this.path=bfsNext(mazeGrid,MW,MH,this.gx,this.gz,nx,nz);break;}
        }
      }
    }

    // 추격 중에는 주기적으로 으르렁댄다 — 쫓기고 있다는 게 계속 들리도록.
    // 멀리 있는 개체까지 울면 소리가 뭉치므로 가까울 때만 낸다.
    if(this.state==='chase'){
      this.snarlT-=dt;
      if(this.snarlT<=0){
        this.snarlT=SNARL_MIN+Math.random()*SNARL_VAR;
        const dxS=this.wx-P.x,dzS=this.wz-P.z;
        if(dxS*dxS+dzS*dzS < 18*18) playGrowl(this.wx,this.wz);
      }
    }

    // move — 발각 직후 CHARGE_TIME 동안 달려든다
    this.chargeT-=dt;
    const charge=this.chargeT>0?CHARGE_BOOST:1;
    const spd=this.state==='chase'?this.spd*(1+0.05*lv)*charge:this.spd*0.55;
    // 이동 목표를 먼저 정한다.
    //
    // ★ 최종 접근 — BFS는 칸 중심에서 칸 중심으로만 이동하고, 플레이어가 있는 칸에
    //   도착하면 bfsNext()가 (시작==목표) null을 반환해 몬스터가 거기서 멈춘다.
    //   그런데 플레이어는 칸 안 아무 데나 설 수 있어(벽 충돌 여유 때문에 칸 중심에서
    //   최대 0.96칸) 즉사 판정 0.7에 닿지 않는 사각이 생긴다. 실제로 눈앞에 두고도
    //   죽지 않는 버그가 여기서 나왔다.
    //   그래서 가까이 붙고 시야가 통하면 격자를 버리고 플레이어의 실제 좌표로 향한다.
    let tx=null,tz=null,onGrid=false;
    const apx=P.x-this.wx, apz=P.z-this.wz;
    const dPlayer=Math.sqrt(apx*apx+apz*apz);
    if(this.state==='chase'&&sees&&dPlayer<CELL*1.2){
      tx=P.x; tz=P.z;
    }else if(this.path){
      const[tgx,tgz]=this.path;
      // NaN/유효하지 않은 좌표 방어 — bfsNext 실패 시 path를 즉시 폐기
      if(!Number.isFinite(tgx)||!Number.isFinite(tgz)||tgx<0||tgz<0||tgx>=MW||tgz>=MH){
        this.path=null;
      } else {
        tx=tgx*CELL; tz=tgz*CELL; onGrid=true;
      }
    }

    if(tx!==null){
      const dx=tx-this.wx,dz=tz-this.wz,dist=Math.sqrt(dx*dx+dz*dz);
      if(onGrid&&dist<0.1){
        this.wx=tx;this.wz=tz;this.gx=Math.round(tx/CELL);this.gz=Math.round(tz/CELL);
        this.path=null;this.alertTimer=0;
      }else if(dist>1e-4){
        this.wx+=dx/dist*spd*dt;this.wz+=dz/dist*spd*dt;
        this.facing=Math.atan2(dx,dz);   // 진행 방향 — 실제 회전은 아래에서 부드럽게 따라간다
        if(!onGrid){
          // 직접 접근 중에도 격자 좌표를 따라 갱신해 둬야, 시야를 잃었을 때 BFS가 이어진다.
          // 벽 칸으로는 절대 옮기지 않는다 — bfsNext가 벽에서 출발하면 경로를 못 찾는다.
          const ngx=Math.round(this.wx/CELL), ngz=Math.round(this.wz/CELL);
          if(mazeGrid[ngz]&&mazeGrid[ngz][ngx]===1){this.gx=ngx;this.gz=ngz;}
          this.path=null;
        }
        // 발소리는 아래 사지 애니메이션의 위상에서 직접 뽑는다 (this.anim이 π를 넘을 때
        // = 발이 바닥을 딛는 순간). 예전에는 여기서 dt*spd*1.5라는 별도 계산을 썼는데,
        // 실측상 눈에 보이는 걸음(3.02/s)과 소리(1.13/s)가 2.7배 어긋나 있었다.
      }
    }
    // 위치 자체가 이미 NaN이 됐다면 안전한 좌표로 즉시 복구 (렌더러 크래시 방지)
    if(!Number.isFinite(this.wx)||!Number.isFinite(this.wz)){
      this.wx=this.gx*CELL; this.wz=this.gz*CELL;
      if(!Number.isFinite(this.wx)||!Number.isFinite(this.wz)){this.wx=CELL;this.wz=CELL;this.gx=1;this.gz=1;}
    }
    // ── 사지 애니메이션 ──
    // ★ 위상은 시간이 아니라 "실제로 간 거리"로 돈다. 시간으로 돌리면 다리가 도는 속도와
    //   실제 이동 속도가 따로 놀아 발이 땅을 딛지 않고 허공을 젓는다(footskate).
    //   실측: 시간 기반일 때 추격 중 다리가 필요한 것의 1.93배로 돌고 있었다
    //   (실제 2.36m/s인데 보폭×걸음수는 4.57m/s). 순찰은 반대로 0.47배라 미끄러졌다.
    //   거리 기반이면 순찰·추격·돌진 보정(×1.35)·레벨당 속도 증가까지 전부 자동으로 맞는다.
    const chasing=this.state==='chase';
    const legAmp=chasing?MON_STRIDE_CHASE:MON_STRIDE_WALK;
    const stride=2*MON_LEG_LEN*Math.sin(legAmp);   // 다리 스윙이 만드는 한 걸음의 보폭(m)
    const moved=Math.hypot(this.wx-this._px,this.wz-this._pz);
    this._px=this.wx; this._pz=this.wz;
    // 레벨 시작·순간이동으로 좌표가 크게 점프하면 위상이 미친 듯이 돌아간다. 한 프레임 상한.
    let dPhase=Math.min(moved/stride*Math.PI, dt*14);
    // 완전히 멈춰 있으면 위상이 얼어붙어 정지 화면이 된다. 아주 작은 숨쉬기만 섞는다.
    if(dPhase<dt*0.5) dPhase=dt*0.5;
    const animPrev=this.anim;
    this.anim+=dPhase;

    // 발소리 — 위상이 π를 넘을 때마다 한 걸음. 눈에 보이는 발과 정확히 같은 박자다.
    // (실제로 이동 중일 때만. 제자리 숨쉬기로는 발소리가 나면 안 된다)
    if(moved>1e-4 && Math.floor(this.anim/Math.PI)>Math.floor(animPrev/Math.PI)){
      const ddx=this.wx-P.x, ddz=this.wz-P.z;
      if(ddx*ddx+ddz*ddz < 30*30) monsterStep(this.wx,this.wz);
    }

    const a=this.anim, sw=Math.sin(a);
    let bobAmt;
    if(this.type==='crawler'){
      // 절지동물 걸음 — 대각선 두 다리(앞왼쪽+뒤오른쪽 / 앞오른쪽+뒤왼쪽)가 짝을 이뤄
      // 반대 위상으로 움직인다. 위 마디(관절1)는 앞뒤로 크게, 아래 마디(관절2)는 작고
      // 살짝 지연되게 흔든다 — standard 팔꿈치가 "거의 고정 + 살짝 지연"인 것과 같은 원리.
      // splay/굽힘(생성자에서 정한 rotation.z)은 건드리지 않는다 — 정적인 다리 형태고,
      // 걷는 움직임은 X축(앞뒤 스윙)만으로 표현한다. 이동 중일 때만, 속도에 비례해서 흔든다.
      const speedFrac=moved>1e-4?Math.min(1,spd/(MON_BASE_SPD*2.5)):0;
      const upperAmp=speedFrac*0.6, lowerAmp=speedFrac*0.30;
      const swA=sw*upperAmp, swB=-sw*upperAmp;      // 대각선 쌍이 반대 위상
      this.armL.rotation.x=swA; this.legR.rotation.x=swA;
      this.armR.rotation.x=swB; this.legL.rotation.x=swB;
      this.foreL.rotation.x= sw*lowerAmp; this.shinR.rotation.x= sw*lowerAmp;
      this.foreR.rotation.x=-sw*lowerAmp; this.shinL.rotation.x=-sw*lowerAmp;
      this.head.rotation.z=0; this.head.rotation.x=0.08;   // 고개를 든 채 거의 고정
      bobAmt=Math.abs(sw)*speedFrac*0.04;
    }else{
      const swSlow=Math.sin(a*.5+.7);      // 다리와 약분되는 배수만 쓴다. 1.73배·2.4배처럼
                                           // 약분 안 되는 주파수를 섞으면 영원히 같은 자세로
                                           // 돌아오지 않아 눈에는 그냥 진동으로 읽힌다.
      // 팔은 다리와 "같은 주파수, 반대 위상"으로 무겁게 흔들린다. 긴 팔이 성큼성큼 걷는
      // 몸을 따라 늘어져 흔들리는 그림이다. 옆으로 휘젓지 않는다.
      const armAmp=chasing?.62:.26;
      this.armL.rotation.x=-sw*armAmp;
      this.armR.rotation.x= sw*armAmp;
      this.armL.rotation.z= .20+(chasing?.10:0)+swSlow*.05;
      this.armR.rotation.z=-.20-(chasing?.10:0)-swSlow*.05;
      // 팔꿈치는 거의 고정하고 살짝 지연시켜 따라오게만 한다
      this.foreL.rotation.x=(chasing?-.62:-.34)-sw*.16;
      this.foreR.rotation.x=(chasing?-.62:-.30)+sw*.16;
      this.legL.rotation.x=-sw*legAmp;
      this.legR.rotation.x= sw*legAmp;
      // 고개는 고정한다. 흔들면 "가누지 못하는" 것이지 "노리는" 것이 아니다.
      this.head.rotation.z=swSlow*(chasing?.05:.08);
      this.head.rotation.x=chasing?.26:.10;
      bobAmt=Math.abs(sw)*(chasing?.075:.022);
    }

    // 걸을 때 상하로 튀는 반동 — 보폭이 커진 만큼 한 걸음의 무게가 실린다
    this.group.position.set(this.wx,.1+bobAmt,this.wz);

    // 입 — 발각하면 벌어지고 시야를 잃으면 다물린다. 즉시 여닫지 않고 보간한다.
    const jawTarget=chasing?MON_JAW_OPEN:0;
    this.jawOpen+=(jawTarget-this.jawOpen)*Math.min(1,dt*(chasing?11:4));
    this.jaw.rotation.x=this.jawOpen;
    // 위턱은 아주 조금만 젖힌다. 크게 젖히면 두개골이 통째로 들려 머리가 몸에서
    // 떨어져 나온 것처럼 보인다(0.34에서 실제로 그랬다). 벌리는 일은 아래턱이 한다.
    this.upperJaw.rotation.x=-this.jawOpen*.15;

    // 진행 방향을 바라본다. 각도차를 -π~π로 감아 최단 경로로 회전시켜야
    // ±π 경계에서 한 바퀴 헛도는 것을 막을 수 있다.
    let d=this.facing-this.group.rotation.y;
    while(d> Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;
    this.group.rotation.y+=d*Math.min(1,dt*9);
  }
  distToPlayer(){const dx=this.wx-P.x,dz=this.wz-P.z;return Math.sqrt(dx*dx+dz*dz);}
  remove(){scene.remove(this.group);}
}
let monsters=[];

// 몬스터 눈 광원 풀(monLightPool)은 제거했다. 백룸 개체는 눈이 없는 검은 실루엣이라
// 발광할 곳이 없고, 밝은 벽을 배경으로 한 대비가 예전의 눈빛보다 훨씬 멀리서 보인다.
// 부수 효과로 광원이 프리셋마다 1~3개 줄었다 (5/6/9/11 → 4/5/6/8).

// ── FOG OF WAR ──
let visited=[];
function initVisited(){visited=Array.from({length:MH},()=>new Array(MW).fill(false));_lastVisGx=-999;_lastVisGz=-999;_lastVisYaw=999;mmClearTerrain();}
const FOV_COS=Math.cos(60*Math.PI/180);
let _lastVisGx=-999,_lastVisGz=-999,_lastVisYaw=999;
function updateVisibility(){
  const pgx=Math.round(P.x/CELL),pgz=Math.round(P.z/CELL);
  // 같은 칸에 머물고 시야각도 거의 안 바뀌었으면 재계산 스킵 — 매 프레임 25칸 스캔 낭비 제거
  const yawDelta=Math.abs(P.yaw-_lastVisYaw);
  if(pgx===_lastVisGx&&pgz===_lastVisGz&&yawDelta<0.15) return;
  _lastVisGx=pgx;_lastVisGz=pgz;_lastVisYaw=P.yaw;

  if(pgx>=0&&pgz>=0&&pgx<MW&&pgz<MH&&!visited[pgz][pgx]){visited[pgz][pgx]=true;_mmNew.push([pgx,pgz]);}
  const fwdX=-Math.sin(P.yaw),fwdZ=-Math.cos(P.yaw);
  for(let dz=-2;dz<=2;dz++)for(let dx=-2;dx<=2;dx++){
    if(dx===0&&dz===0)continue;
    if(dx*dx+dz*dz>4)continue;
    const len=Math.sqrt(dx*dx+dz*dz);
    if((dx/len)*fwdX+(dz/len)*fwdZ<FOV_COS)continue;
    const gx=pgx+dx,gz=pgz+dz;
    if(gx<0||gz<0||gx>=MW||gz>=MH)continue;
    if(!visited[gz][gx]&&hasLOS(mazeGrid,MW,MH,pgx,pgz,gx,gz)){visited[gz][gx]=true;_mmNew.push([gx,gz]);}
  }
}

// ── MINIMAP ──
const mm=document.getElementById('mmCanvas'),mc=mm.getContext('2d'),MM=110;
// 지형(길/벽) 레이어는 새로 밝혀진 칸이 있을 때만 오프스크린에 갱신 — 매 프레임 625칸 순회 제거
const mmTerrain=document.createElement('canvas');mmTerrain.width=MM;mmTerrain.height=MM;
const mtCtx=mmTerrain.getContext('2d');
let _mmNew=[];   // 아직 지형 레이어에 반영되지 않은 새 칸

// 지형 레이어는 "새로 밝혀진 칸"만 덧그린다. 전체를 다시 그리면 41×41에서 1,681칸을
// 걸을 때마다 훑게 된다. 캔버스는 유지되므로 새 칸만 얹으면 된다.
function mmClearTerrain(){
  mtCtx.clearRect(0,0,MM,MM);mtCtx.fillStyle='rgba(0,0,0,.92)';mtCtx.fillRect(0,0,MM,MM);
  _mmNew.length=0;
}
function mmDrawNewCells(){
  const cw=MM/MW,ch=MM/MH;
  for(const[c,r] of _mmNew){
    mtCtx.fillStyle=mazeGrid[r][c]===1?'#c8854a':'#2a1e12';
    mtCtx.fillRect(c*cw,r*ch,cw,ch);
  }
  _mmNew.length=0;
}

function drawMM(){
  if(_mmNew.length) mmDrawNewCells();

  const cw=MM/MW,ch=MM/MH;
  mc.clearRect(0,0,MM,MM);
  mc.drawImage(mmTerrain,0,0); // 캐싱된 지형을 그대로 복사

  // 출구 — 잠겨 있으면 호박색, 열쇠를 얻으면 초록. 지형 레이어가 아니라 여기서
  // 그려야 상태가 바뀔 때 지형을 통째로 다시 그리지 않아도 된다.
  if(visited[exitPos.z]&&visited[exitPos.z][exitPos.x]){
    mc.fillStyle=hasKey?'#0f8':'#fa3';mc.shadowColor=hasKey?'#0f8':'#fa3';mc.shadowBlur=5;
    mc.fillRect(exitPos.x*cw+1,exitPos.z*ch+1,cw-2,ch-2);mc.shadowBlur=0;
  }
  // 열쇠 — 아직 안 주웠고 그 칸을 밝혔을 때만
  if(!hasKey&&visited[keyPos.z]&&visited[keyPos.z][keyPos.x]){
    mc.fillStyle='#fd6';mc.shadowColor='#fd6';mc.shadowBlur=6;
    mc.beginPath();mc.arc(keyPos.x*cw+cw/2,keyPos.z*ch+ch/2,Math.max(cw,ch)*.55,0,Math.PI*2);
    mc.fill();mc.shadowBlur=0;
  }

  for(const m of monsters){
    if(!visited[m.gz]||!visited[m.gz][m.gx])continue;
    mc.fillStyle=m.state==='chase'?'#f00':'#800';
    mc.shadowColor='#f00';mc.shadowBlur=4;
    mc.beginPath();mc.arc(m.wx/CELL*cw,m.wz/CELL*ch,Math.max(cw,ch)*.9,0,Math.PI*2);mc.fill();mc.shadowBlur=0;
  }
  const px=P.x/CELL*cw,pz=P.z/CELL*ch;
  mc.fillStyle='#ffaa33';mc.shadowColor='#ff8800';mc.shadowBlur=7;
  mc.beginPath();mc.arc(px,pz,Math.max(cw,ch)*.7,0,Math.PI*2);mc.fill();
  mc.strokeStyle='#ffe';mc.lineWidth=1.5;mc.shadowBlur=0;
  mc.beginPath();mc.moveTo(px,pz);mc.lineTo(px-Math.sin(P.yaw)*cw*1.5,pz-Math.cos(P.yaw)*ch*1.5);mc.stroke();
  mc.strokeStyle='rgba(255,130,30,.4)';mc.lineWidth=1;mc.strokeRect(0,0,MM,MM);
}

// ── SPAWN ──
// 모든 길 칸 목록 (매 레벨 1회 수집해 시작·출구·몬스터 배치에 재사용)
let pathCells=[];
function collectPathCells(){
  pathCells.length=0;
  for(let r=1;r<MH-1;r++)for(let c=1;c<MW-1;c++)
    if(mazeGrid[r][c]===1) pathCells.push([c,r]);
}

// 시작 지점과 출구를 무작위로 잡되, 둘 사이 "실제 이동 거리"가 충분히 멀어야 한다.
// 직선거리로 재면 벽 하나 사이에 두고 붙어 있을 수 있다.
function pickStartAndExit(){
  collectPathCells();
  if(!pathCells.length) return {start:[1,1],exit:[1,1]};
  const start=pathCells[(Math.random()*pathCells.length)|0];
  const dist=bfsDistances(mazeGrid,MW,MH,start[0],start[1]);
  let far=0;
  for(const[c,r]of pathCells){const d=dist[r*MW+c]; if(d>far)far=d;}
  // 가장 먼 지점의 75% 이상 떨어진 칸 중에서 무작위 — 매번 다르면서도 항상 멀다
  const cand=pathCells.filter(([c,r])=>dist[r*MW+c]>=far*0.75);
  const exit=cand.length?cand[(Math.random()*cand.length)|0]:pathCells[pathCells.length-1];
  return {start,exit,startDist:far};
}

// 몬스터는 플레이어에게서 최소 거리 이상 떨어진 칸에만 스폰한다.
// 시작하자마자 눈앞에 있으면 손쓸 도리가 없다.
function findSpawn(playerDist,minDist){
  const cand=pathCells.filter(([c,r])=>playerDist[r*MW+c]>=minDist);
  if(cand.length) return cand[(Math.random()*cand.length)|0];
  // 조건을 만족하는 칸이 없으면(작은 미로) 가장 먼 칸으로
  let best=pathCells[0],bd=-1;
  for(const[c,r]of pathCells){const d=playerDist[r*MW+c]; if(d>bd){bd=d;best=[c,r];}}
  return best||[1,1];
}

// ── LEVEL ──
let level=1,steps=0,gameActive=false;
// 1층/2층 구조 — level은 "스테이지" 번호, floor는 그 안의 층(1 또는 2)이다.
let floor=1;
function startLevel(lv){
  level=lv;gameActive=false;lastStep=0;
  if(floor===1) steps=0;   // 스테이지 시작(1층)에서만 리셋 — 2층은 이어서 센다
  monsters.forEach(m=>m.remove());monsters=[];
  MW=MH=mazeSizeFor(lv);                       // 레벨이 오를수록 넓어진다 (상한 MAZE_MAX)
  mazeGrid=generateMaze(MW,MH);
  const {start,exit}=pickStartAndExit();
  exitPos={x:exit[0],z:exit[1]};
  P.x=start[0]*CELL;P.z=start[1]*CELL;P.vx=0;P.vz=0;P.spd=0;P.pitch=0;
  // 정전은 레벨을 넘어 이어지면 안 된다 — 이전 레벨 끝에서 정전 중이었다면(예: 정전 중
  // 출구에 도달) 새 레벨이 어두운 채로 시작해 버린다. 형광판 재질도 같이 복구해야 한다 —
  // 정전 도중 탈출하면 blackoutT만 리셋하고 emissiveIntensity 복구 코드는 못 거친다.
  blackoutT=-1;_blackoutCooldown=BLACKOUT_COOLDOWN_MIN+Math.random()*BLACKOUT_COOLDOWN_VAR;
  flashlight.intensity=0;
  mPanel.emissiveIntensity=MPANEL_EI; mCeil.emissiveIntensity=MCEIL_EI; mCeil2.emissiveIntensity=MCEIL_EI;
  // 시작 시 뚫린 쪽을 바라보게 — 전방 벡터가 (-sin,-cos)이므로 yaw=atan2(-dx,-dz)
  P.yaw=0;
  for(const[dx,dz]of[[0,-1],[1,0],[0,1],[-1,0]]){
    if(!isWall(start[0]+dx,start[1]+dz)){P.yaw=Math.atan2(-dx,-dz);break;}
  }
  P.targetYaw=P.yaw;
  bob.phase=0;bob.y=0;bob.roll=0;
  // 플레이어 기준 거리 맵을 한 번만 구해 열쇠·몬스터 배치에 재사용
  // 열쇠는 시작 지점에서 충분히 떨어진 칸에. 출구는 잠겨 있으므로 미로 전체가
  // 언제나 도달 가능하고, 따라서 "열쇠가 문 뒤에 갇히는" 상황이 생기지 않는다.
  // ⚠ buildWorld()가 keyPos를 읽어 열쇠 메시를 놓으므로 반드시 그 앞에서 정한다.
  const pDist=bfsDistances(mazeGrid,MW,MH,start[0],start[1]).slice();
  hasKey=false;
  {
    let far=0;
    for(const[c,r]of pathCells){const d=pDist[r*MW+c]; if(d>far)far=d;}
    const cand=pathCells.filter(([c,r])=>
      pDist[r*MW+c]>=far*0.45 && !(c===exit[0]&&r===exit[1]));
    const k=cand.length?cand[(Math.random()*cand.length)|0]:start;
    keyPos={x:k[0],z:k[1]};
  }
  // 2층은 열쇠가 필요 없다 — 위 배치는 그대로 두고(keyMesh는 어차피 안 보임) 소지 상태만 켠다.
  if(floor===2) hasKey=true;
  // 스프레이 화살표 배치 — 시작·출구 칸을 제외한 무작위 길 칸 1곳.
  // 직선(나침반) 방향만 가리키므로 벽을 사이에 두면 틀릴 수 있다 — 의도된 부정확함이다.
  // ⚠ buildWorld()가 이 값을 읽어 데칼을 놓으므로 반드시 그 앞에서 정한다(keyPos와 동일한 이유).
  {
    const cand=pathCells.filter(([c,r])=>
      !(c===start[0]&&r===start[1]) && !(c===exit[0]&&r===exit[1]));
    const a=cand.length?cand[(Math.random()*cand.length)|0]:start;
    arrowPos={x:a[0],z:a[1]};
  }
  buildWorld();initVisited();updateVisibility();drawMM();
  const cnt=FLOOR_MON_COUNT(lv,floor),crawlerCnt=FLOOR_CRAWLER_COUNT(lv,floor);
  const spd=MON_BASE_SPD*(1+MON_SPD_INC*(lv-1));
  const minSpawn=Math.max(8,Math.floor(MW*0.35));
  // 1층=stage마리(전부 standard) / 2층=stage+1마리(크롤러 고정 1 + 나머지 standard).
  // 광원 개수(크롤러도 mMonBody 뿐이라 광원을 안 만든다)는 그대로 — 타입 구성만 바뀐다.
  for(let i=0;i<cnt;i++){
    const[gx,gz]=findSpawn(pDist,minSpawn);
    const type=i<crawlerCnt?'crawler':'standard';
    monsters.push(new Monster(gx,gz,spd*MONSTER_TYPES[type].spdMul,type));
  }
  updateMonBar(cnt);
  document.getElementById('hudLv').textContent=lv+' · '+floor+'F';
  document.getElementById('hudSt').textContent=steps;
  document.getElementById('hudEsc').textContent=escaped;
  document.getElementById('danger').style.opacity='0';
  markLevel(lv);
  gameActive=true;
}
// 1층→2층 — 승리 화면 없이 즉시 다음 미로로 전환한다(사다리를 오르는 순간).
// startLevel()이 floor를 그대로 읽으므로, 여기서 미리 2로 바꿔 두기만 하면
// 몬스터 공식·열쇠 스킵 분기가 전부 알아서 맞는다.
function climbLadder(){
  floor=2;
  startLevel(level);
  const fl=document.getElementById('flash');fl.style.opacity='.5';setTimeout(()=>fl.style.opacity='0',180);
}
function onEscape(){
  gameActive=false;escaped++;markEscape(level+1);playEscape();
  document.getElementById('winSub').textContent='Level '+level+' cleared · Steps: '+steps;
  document.getElementById('winRec').textContent='최고 레벨 '+progress.bestLevel+' · 누적 탈출 '+progress.totalEscapes;
  showScreen('winScreen');
  const fl=document.getElementById('flash');fl.style.opacity='.6';setTimeout(()=>fl.style.opacity='0',200);
}
function onDeath(){
  gameActive=false;playDeath();

  document.getElementById('deadRec').textContent='최고 레벨 '+progress.bestLevel+' · 누적 탈출 '+progress.totalEscapes;
  showScreen('deadScreen');

}

// ── 품질 프리셋 선택 UI (타이틀 화면 전용) ──
// 광원 개수·텍스처·재질·antialias는 부팅 시점에 확정되므로 reload로만 적용한다.
// 타이틀 화면에서는 잃을 진행 상황이 없고, SW 캐시 덕에 리로드가 즉시 끝난다.

  // +1은 손전등. 정전 중이 아니면 intensity=0이라 실제 밝기 기여는 없지만,

// 사망·재시작·다음 스테이지는 전부 1층부터 시작한다(합의된 저장 규칙과 동일 —

document.getElementById('retryBtn').addEventListener('click',()=>{unlockAudio();showScreen(null);floor=1;startLevel(level);});

// ── 성능 계측 ──
const perfEl=document.getElementById('perf');
const pFps=document.getElementById('pFps'), pMs=document.getElementById('pMs');
const pMin=document.getElementById('pMin'), pAvg=document.getElementById('pAvg');
const pCalls=document.getElementById('pCalls'), pTris=document.getElementById('pTris');
const pLights=document.getElementById('pLights'), pObjs=document.getElementById('pObjs');
const pQual=document.getElementById('pQual'), pScale=document.getElementById('pScale');
let perfOn=true;
let _frames=0,_accum=0;                       // 표시 구간(1초) 집계
let _minFps=Infinity;                          // 세션 최저 FPS (계속 유지)
let _totFrames=0,_totTime=0;                   // 세션 전체 평균용
let _worstCalls=0;                             // 세션 최대 draw call

function resetPerfStats(){
  _minFps=Infinity;_totFrames=0;_totTime=0;_worstCalls=0;
  _frames=0;_accum=0;
  // 적응형이 이미 낮춰둔 해상도를 프리셋 기본값으로 되돌린다 — 프리셋별 실측 조건을 맞추기 위함
  _lowSec=0;_hiSec=0;
  if(renderScale!==Q.scale){renderScale=Q.scale;applyRenderScale();}
  pMin.textContent='--';pAvg.textContent='--';
  perfEl.style.borderColor='rgba(255,220,120,.9)';
  setTimeout(()=>perfEl.style.borderColor='',300);
}

// 1회 탭 = 기록 초기화 / 3회 연속 탭 = 표시 토글
let _tapCount=0,_tapTimer=null;
function handlePerfTap(){
  _tapCount++;
  clearTimeout(_tapTimer);
  if(_tapCount>=3){
    _tapCount=0; perfOn=!perfOn;
    perfEl.classList.toggle('hidden',!perfOn);
    return;
  }
  _tapTimer=setTimeout(()=>{
    if(_tapCount===1) resetPerfStats();
    _tapCount=0;
  },450);
}
const perfToggleEl=document.getElementById('perfToggle');
perfToggleEl.addEventListener('touchstart',e=>{e.preventDefault();handlePerfTap();},{passive:false});
perfToggleEl.addEventListener('click',()=>handlePerfTap());

function cls(v,warn,bad){return v>=bad?'pv bad':v>=warn?'pv warn':'pv';}

// ── 적응형 해상도 조절 ──
// 조절 대상은 renderScale 하나뿐. 광원·재질·텍스처는 절대 건드리지 않는다
// (개수가 바뀌면 셰이더가 재컴파일되어 플레이 중 hitching이 발생한다).
// 하향은 빠르게(3초), 복구는 느리게(10초) — 경계에서 진동하는 것을 막기 위한 히스테리시스.
const ADAPT_MIN=0.5;
let _lowSec=0,_hiSec=0;
function adaptQuality(fps){
  if(!gameActive) return;                       // 타이틀·결과 화면에서는 조절하지 않음
  const target=Q.targetFps;
  if(fps<target){ _lowSec++; _hiSec=0; }
  else if(fps>target*1.15){ _hiSec++; _lowSec=0; }
  else { _lowSec=0; _hiSec=0; }

  if(_lowSec>=3 && renderScale>ADAPT_MIN){
    renderScale=Math.max(ADAPT_MIN,Math.round((renderScale-0.1)*100)/100);
    applyRenderScale(); _lowSec=0;
  }else if(_hiSec>=10 && renderScale<Q.scale){
    renderScale=Math.min(Q.scale,Math.round((renderScale+0.05)*100)/100);
    applyRenderScale(); _hiSec=0;
  }
}

function updatePerf(rawDt){
  if(rawDt<=0) return;

  // 세션 누적 (표시 주기와 무관하게 항상 기록)
  _totFrames++; _totTime+=rawDt;
  _frames++; _accum+=rawDt;

  const info=renderer.info.render;
  if(info.calls>_worstCalls) _worstCalls=info.calls;

  if(_accum<1.0) return;                        // 1초마다만 집계

  const fps=_frames/_accum;
  const ms=(_accum/_frames)*1000;
  _frames=0; _accum=0;

  // 로딩 직후 첫 구간은 튀므로 최저값 집계에서 제외
  if(_totTime>2.0 && fps<_minFps) _minFps=fps;

  adaptQuality(fps);                            // 패널 표시 여부와 무관하게 동작해야 함
  if(!perfOn) return;                           // 이하 DOM 갱신만 스킵

  let lightCount=0,objCount=0;
  scene.traverse(o=>{ if(o.isLight)lightCount++; if(o.isMesh)objCount++; });

  pFps.textContent=fps.toFixed(0);
  pFps.className=fps<30?'pv bad':fps<55?'pv warn':'pv';
  pMs.textContent='('+ms.toFixed(1)+'ms)';

  if(_minFps<Infinity){
    pMin.textContent=_minFps.toFixed(0);
    pMin.className=_minFps<30?'pv bad':_minFps<55?'pv warn':'pv';
  }
  const avg=_totFrames/_totTime;
  pAvg.textContent=avg.toFixed(0);
  pAvg.className=avg<30?'pv bad':avg<55?'pv warn':'pv';

  pCalls.textContent=info.calls;
  pCalls.className=cls(info.calls,150,400);
  pTris.textContent=(info.triangles/1000).toFixed(1)+'k';
  pLights.textContent=lightCount;
  pLights.className=cls(lightCount,9,16);
  pObjs.textContent=objCount;
  // 청크 병합 이후 41×41에서 200~400이 정상 범위다. 병합 전(칸마다 Mesh) 기준인
  // 150/400을 그대로 두면 정상값에 계속 경고가 뜬다.
  pObjs.className=cls(objCount,600,1200);

  pQual.textContent=QNAME;
  pScale.textContent='×'+renderScale.toFixed(2);
  pScale.className=renderScale<Q.scale?'pv warn':'pv';
}

// ── GAME LOOP ──
let _lastHeartbeat=0;   // 심장박동 간격 — 소리 자체는 audio.js, 박자는 게임 루프가 관리
const clock=new THREE.Clock();
let mmTick=0;
function animate(){
  requestAnimationFrame(animate);
  const rawDt=clock.getDelta();          // 클램프 전 실제 프레임 간격 (계측용)
  const dt=Math.min(rawDt,.05);          // 게임 로직용 (물리 폭주 방지)
  const t=clock.elapsedTime;
  try{
    if(gameActive){
      // player move — 회전은 우측 시선 영역에서 직접 P.yaw를 갱신(위 touchR 리스너), 키보드 좌우도 함께 반영
      P.yaw+=(K.tL-K.tR)*TURN_SPD*dt;

      const fwd=-(K.f-K.b)+(-jFwd);
      const strafe=dSide; // 좌측 D-pad 좌/우 버튼 — 캐릭터 기준 좌우 횡이동
      const sin=Math.sin(P.yaw),cos=Math.cos(P.yaw);
      // 전방 벡터: (-sin,-cos)  /  우측 벡터: (cos,-sin) — 횡이동은 우측 벡터를 사용
      const dvx=-sin*fwd*PLAYER_SPD + cos*strafe*PLAYER_SPD;
      const dvz=-cos*fwd*PLAYER_SPD - sin*strafe*PLAYER_SPD;
      const bl=Math.min(ACCEL*dt,1);
      P.vx+=(dvx-P.vx)*bl;P.vz+=(dvz-P.vz)*bl;
      if(Math.abs(fwd)<.05&&Math.abs(strafe)<.05){P.vx*=Math.max(0,1-FRIC*dt);P.vz*=Math.max(0,1-FRIC*dt);}
      P.spd=Math.sqrt(P.vx*P.vx+P.vz*P.vz);
      const nx=P.x+P.vx*dt,nz=P.z+P.vz*dt;
      if(!blocked(nx,P.z))P.x=nx;else P.vx*=-.04;
      if(!blocked(P.x,nz))P.z=nz;else P.vz*=-.04;
      // bob
      const moving=P.spd>.25;
      if(moving)bob.phase+=dt*7.2*(P.spd/PLAYER_SPD);else bob.phase+=dt*3.5;
      const hc=0|bob.phase/Math.PI;
      if(moving&&hc!==lastStep){lastStep=hc;footstep();steps++;document.getElementById('hudSt').textContent=steps;}
      bob.y=moving?Math.sin(bob.phase)*.058:Math.sin(bob.phase)*.004;
      bob.roll=moving?Math.sin(bob.phase*.5)*.009:0;
      // camera
      camera.position.set(P.x,1.22+bob.y,P.z);
      camera.rotation.order='YXZ';camera.rotation.y=P.yaw;camera.rotation.x=P.pitch;camera.rotation.z=bob.roll;
      // monsters
      for(const m of monsters)m.update(dt,level,t);
      // death check
      for(const m of monsters)if(m.distToPlayer()<MON_KILL_R){onDeath();return;}
      // exit check
      // 출구 도달 — 열쇠가 없으면 잠긴 문에 막힌다
      if(Math.round(P.x/CELL)===exitPos.x&&Math.round(P.z/CELL)===exitPos.z){
        if(hasKey){
          if(floor===1){climbLadder();return;}
          onEscape();return;
        }
        else if(t-_lastLocked>1.2){_lastLocked=t;playLocked();showHint('잠겨 있다 — 열쇠를 찾아라');}
      }
      // 열쇠 획득
      if(!hasKey){
        const kdx=keyPos.x*CELL-P.x, kdz=keyPos.z*CELL-P.z;
        if(kdx*kdx+kdz*kdz < KEY_PICK_R*KEY_PICK_R){
          hasKey=true;applyKeyState();playKeyPickup();showHint('열쇠를 손에 넣었다');
        }
      }
      updateVisibility();
      if((mmTick++%Q.mmInterval)===0)drawMM();
      updateDanger();

      // ── 공간 오디오 ──
      updateAudioListener(P.x,P.z,P.yaw);          // 귀 위치/방향을 카메라에 동기화

      // 가장 가까운 몬스터 거리에 따라 심장박동 (가까울수록 빠르게)
      let nearest=Infinity;
      for(const m of monsters) nearest=Math.min(nearest,m.distToPlayer());
      if(nearest<7){
        const inten=Math.min(1,(7-nearest)/6);
        const interval=0.95-inten*0.5;   // 가까울수록 짧은 간격
        if(t-_lastHeartbeat>interval){ _lastHeartbeat=t; heartbeat(inten); }
      }

      // 형광등 버즈 — 활성 광원 중 하나에서 가끔 (초당 약 0.5회)
      if(Math.random()<dt*0.5){
        const on=panelLightPool.filter(l=>l.userData.on);
        if(on.length){
          const l=on[(Math.random()*on.length)|0];
          panelBuzz(l.position.x,l.position.y,l.position.z);
        }
      }

      // ── 정전 상태 갱신 ──
      // blackoutT 하나로 세 구간을 표현한다: 평상시(-1) → 암전(0~FLASH_DELAY,
      // 손전등도 꺼짐) → 손전등만 켜짐(FLASH_DELAY~BLACKOUT_DURATION) → 복구.
      if(blackoutT<0){
        _blackoutCooldown-=dt;
        if(_blackoutCooldown<=0 && Math.random()<dt*BLACKOUT_CHANCE_PER_SEC) blackoutT=0;
      }else{
        blackoutT+=dt;
        if(blackoutT>=BLACKOUT_DURATION){
          blackoutT=-1;
          _blackoutCooldown=BLACKOUT_COOLDOWN_MIN+Math.random()*BLACKOUT_COOLDOWN_VAR;
        }
      }
      // 진입/탈출 시점에만 한 번 바꾸지 않고 매 프레임 현재 상태를 그대로 반영한다 —
      // blackoutT가 나중에 다른 경로로 바뀌어도 조명·재질이 항상 같은 결론을 낸다.
      // 형광판·천장 발광 재질도 PointLight와 같이 꺼야 한다 — 이 둘은 서로 다른 시스템이라
      // PointLight만 끄면 발광 텍스처가 여전히 하얗게 빛나 정전처럼 안 보인다.
      const dark=blackoutT>=0;
      mPanel.emissiveIntensity=dark?0:MPANEL_EI;
      mCeil.emissiveIntensity=dark?0:MCEIL_EI;
      mCeil2.emissiveIntensity=dark?0:MCEIL_EI;   // 2층 천장 재질도 같이 꺼야 한다
      flashlight.intensity=(blackoutT>=FLASH_DELAY)?FLASH_INTENSITY:0;
    }
    // 광원 재배치 (가장 가까운 N개만 실제 광원으로 사용)
    updatePanelLights(dt,t);
    // 활성화된 풀 광원만 깜빡임 적용 (최대 MAX_PANEL_LIGHTS개)
    // 형광등은 횃불과 정반대로 "대체로 일정"해야 한다. 불처럼 흔들면 백룸이 아니라 동굴이 된다.
    // 정전 중에는 이 반복 전체를 건너뛰고 강제로 끈다 — 개별 깜빡임과는 별개의, 훨씬 큰 이벤트.
    for(const l of panelLightPool){
      if(blackoutT>=0){l.intensity=0;continue;}
      if(!l.userData.on){continue;}
      const ph=l.userData.td?l.userData.td.phase:0;
      let k=1+Math.sin(t*9.1+ph)*.035;              // 미세한 떨림
      // 고장 난 등은 phase로 고정한다. 매번 무작위로 고르면 아무 등이나 깜빡여서
      // "저 등이 나갔다"는 인상이 남지 않는다 (약 22%가 해당)
      if(ph>4.9 && Math.sin(t*23.7+ph*3.1)+Math.sin(t*7.9+ph)>1.55) k*=.18;
      l.intensity=1.15*k*Q.panelPower;
    }
    if(keyMesh&&keyMesh.visible){
      keyMesh.rotation.y=t*1.6;
      keyMesh.position.y=1.0+Math.sin(t*2.2)*.075;
    }
    // 캐싱된 portal/exitLight 직접 참조
    if(cachedPortal){cachedPortal.rotation.y=t*.8;cachedPortal.material.emissiveIntensity=1.2+Math.sin(t*2.8)*.6;}
    if(cachedExitLight){
      const dxE=exitPos.x*CELL-P.x, dzE=exitPos.z*CELL-P.z;
      cachedExitLight.intensity=((dxE*dxE+dzE*dzE)<6*6) ? 4+Math.sin(t*3)*1.5 : 0;
      // 색만 바꾼다 — 광원 개수는 그대로여야 셰이더 재컴파일이 없다
      cachedExitLight.color.setHex(hasKey?0x00ff88:0xffaa33);
    }
    renderer.render(scene,camera);
    // renderer.info.render는 render() 시작 시 리셋되므로 반드시 렌더 직후에 읽어야 함
    updatePerf(rawDt);
  }catch(err){
    // 예외가 나도 루프를 죽이지 않고 콘솔에만 기록 — 게임이 통째로 멈추는 것 방지
    console.error('[ANIMATE LOOP ERROR]', err);
  }
}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
animate();
showScreen('titleScreen');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
